# Reusable quality workflow for JavaScript/TypeScript projects (Bun, npm, pnpm).
# Implements the CI slot standard v1 (docs/slots.md):
#   S1 typecheck, S2 lint, S3 workflow lint, G1 secret scan, G2 dependency vulnerabilities,
#   B1 build, L1 unit tests + coverage, L1.5 worker runtime, L2 API E2E, L3 browser E2E,
#   P1 package check, Z1 gate aggregate.
#
# Every slot is a top-level job, so each slot renders exactly one GitHub check named
# "<ID>: <Canonical Name>" (e.g. "G1: Secret Scan"). quality.yml never calls another
# reusable workflow; security.yml / workflow-lint.yml / test-job.yml stay intact for
# direct callers and keep their own job names.
#
# Emits tested-sha and artifact outputs only when all enabled checks succeed and tested-sha matches.

name: Quality Gate

on:
  workflow_call:
    inputs:
      # Ecosystem & Runtimes
      package-manager:
        description: "Package manager: bun, npm, or pnpm"
        type: string
        default: "bun"
      runtime-version:
        description: "Exact Bun, npm, or pnpm version (empty = resolved by setup-js)"
        type: string
        default: ""
      node-version:
        description: "Node.js version (empty = resolved from file or default 26.12.1)"
        type: string
        default: ""
      working-directory:
        description: "Working directory relative to repo root"
        type: string
        default: "."

      # Hardening & Directories
      install-policy:
        description: "Lifecycle script policy: blocked, trusted, or project"
        type: string
        default: "blocked"
      extra-install-dirs:
        description: "Newline or comma-separated extra directories needing install"
        type: string
        default: ""

      # Core checks boolean switches
      typecheck:
        description: "Run typecheck"
        type: boolean
        default: true
      lint:
        description: "Run lint"
        type: boolean
        default: true
      unit:
        description: "Run unit tests"
        type: boolean
        default: true
      security:
        description: "Run security scanner (secrets + osv)"
        type: boolean
        default: true

      # Disabled reasons (JSON object: {"typecheck": "plain JS without tsconfig"})
      disabled-check-reasons:
        description: "Explanations for intentionally disabled core checks"
        type: string
        default: "{}"

      # Core command overrides
      typecheck-command:
        description: "Typecheck command (defaults to bun run typecheck / npm run typecheck / pnpm run typecheck)"
        type: string
        default: ""
      lint-command:
        description: "Lint command (defaults to bun run lint / npm run lint / pnpm run lint)"
        type: string
        default: ""
      test-command:
        description: "Unit test command (defaults to bun run test:coverage / npm run test:coverage / pnpm run test:coverage)"
        type: string
        default: ""
      prepare-command:
        description: "Optional setup command before static/test steps"
        type: string
        default: ""

      # Extended checks boolean switches
      build:
        description: "Run build step"
        type: boolean
        default: false
      build-command:
        description: "Build command"
        type: string
        default: ""

      l2:
        description: "Run L2 API E2E tests"
        type: boolean
        default: false
      l2-command:
        description: "L2 test command"
        type: string
        default: ""
      l2-artifact-name:
        description: "Name of the L2 evidence artifact (empty = no upload)"
        type: string
        default: ""
      l2-artifact-path:
        description: "Path of the L2 evidence to upload (empty = no upload)"
        type: string
        default: ""
      l2-artifact-retention-days:
        description: "L2 evidence artifact retention days"
        type: number
        default: 7

      l3:
        description: "Run L3 Browser E2E tests"
        type: boolean
        default: false
      l3-command:
        description: "L3 test command"
        type: string
        default: ""
      l3-browsers:
        description: "Space-separated Playwright browsers to install (preferred over l3-browser)"
        type: string
        default: ""
      l3-browser:
        description: "Playwright browser to install (chromium, firefox, webkit); ignored when l3-browsers is set"
        type: string
        default: "chromium"
      l3-browser-directory:
        description: "Playwright browser installation directory"
        type: string
        default: ""
      l3-prepare-command:
        description: "Optional setup command for L3 (used when set, otherwise prepare-command)"
        type: string
        default: ""
      l3-artifact-name:
        description: "Name of the L3 evidence artifact (empty = no upload)"
        type: string
        default: ""
      l3-artifact-path:
        description: "Path of the L3 evidence to upload (multiline allowed, empty = no upload)"
        type: string
        default: ""
      l3-artifact-retention-days:
        description: "L3 evidence artifact retention days"
        type: number
        default: 7

      worker:
        description: "Run Cloudflare Worker tests"
        type: boolean
        default: false
      worker-command:
        description: "Worker test command"
        type: string
        default: ""
      worker-directory:
        description: "Worker directory"
        type: string
        default: "worker"
      worker-prepare-command:
        description: "Optional setup command in worker directory (defaults to empty, preserving legacy bun-quality behavior)"
        type: string
        default: ""

      package-check:
        description: "Run package validation checks (publint, attw, etc.)"
        type: boolean
        default: false
      package-command:
        description: "Package check command"
        type: string
        default: ""

      # CI slot standard v1 (docs/slots.md)
      slot-status:
        description: "Slot status declaration JSON, e.g. {\"L3\": {\"status\":\"na\",\"reason\":\"no browser UI\"}}. Empty = legacy mode derived from the boolean inputs"
        type: string
        default: ""
      workflow-lint:
        description: "Run the S3 workflow lint slot"
        type: boolean
        default: false
      workflow-lint-files:
        description: "Space-separated workflow paths checked by S3 (empty = every workflow)"
        type: string
        default: ""
      workflow-lint-required-workflow:
        description: "Reusable workflow that must appear in the files checked by S3"
        type: string
        default: ""
      workflow-lint-yamllint:
        description: "Run yamllint style checks in S3"
        type: boolean
        default: false

      # Security details
      lockfiles:
        description: "Newline or comma-separated lockfiles for OSV scan"
        type: string
        default: ""
      osv-config:
        description: "Path to .osv-scanner.toml (optional)"
        type: string
        default: ""
      gitleaks-config:
        description: "Path to .gitleaks.toml (optional)"
        type: string
        default: ""
      gitleaks-ignore-path:
        description: "Path to .gitleaksignore file (optional)"
        type: string
        default: ""
      security-command:
        description: "Custom security check command (e.g. 'bun run gate:security')"
        type: string
        default: ""

      # Coverage and Artifacts
      coverage-artifact-name:
        type: string
        default: coverage-report
      coverage-path:
        description: "Path to coverage output directory (empty = skip upload)"
        type: string
        default: ""
      artifact-name:
        description: "Name for build/test artifact"
        type: string
        default: ""
      artifact-paths:
        description: "Artifact paths to upload (empty = skip upload)"
        type: string
        default: ""

      # Environment configuration
      env-json:
        description: "Explicit non-sensitive environment variables as JSON object string"
        type: string
        default: "{}"

    secrets:
      test-env-json:
        description: "Optional explicit JSON string of test credentials, forwarded only to test jobs"
        required: false

    outputs:
      tested-sha:
        description: "Commit SHA tested and verified across all enabled jobs"
        value: ${{ jobs.z1-gate.outputs.tested-sha }}
      artifact-id:
        description: "Uploaded build artifact ID if artifact-paths was provided"
        value: ${{ jobs.b1-build.outputs.artifact-id }}

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────
  # S1: Typecheck (independent slot job)
  # ─────────────────────────────────────────────────────
  s1-typecheck:
    name: "S1: Typecheck"
    if: inputs.typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          env-json: ${{ inputs.env-json }}

      - name: Prepare environment
        if: inputs.prepare-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_PREPARE: ${{ inputs.prepare-command }}
        run: |
          echo "Executing prepare-command..."
          bash -euo pipefail -c "$IN_PREPARE"

      - name: "S1: Typecheck"
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_CMD: ${{ inputs.typecheck-command }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          CMD="$IN_CMD"
          if [ -z "$CMD" ]; then
            if [ "$PKG_MGR" = "bun" ]; then
              CMD="bun run typecheck"
            elif [ "$PKG_MGR" = "pnpm" ]; then
              CMD="pnpm run typecheck"
            else
              CMD="npm run typecheck"
            fi
          fi
          TRIMMED="${CMD//[[:space:]]/}"
          if [ -z "$TRIMMED" ] || [ "$TRIMMED" = "true" ] || [ "$TRIMMED" = ":" ]; then
            echo "::error::Invalid typecheck command '$TRIMMED'. Disable typecheck explicitly with disabled-check-reasons instead of using fake-green commands."
            exit 1
          fi
          echo "Running typecheck: $CMD"
          bash -euo pipefail -c "$CMD"

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # S2: Lint (independent slot job)
  # ─────────────────────────────────────────────────────
  s2-lint:
    name: "S2: Lint"
    if: inputs.lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          env-json: ${{ inputs.env-json }}

      - name: Prepare environment
        if: inputs.prepare-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_PREPARE: ${{ inputs.prepare-command }}
        run: |
          echo "Executing prepare-command..."
          bash -euo pipefail -c "$IN_PREPARE"

      - name: "S2: Lint"
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_CMD: ${{ inputs.lint-command }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          CMD="$IN_CMD"
          if [ -z "$CMD" ]; then
            if [ "$PKG_MGR" = "bun" ]; then
              CMD="bun run lint"
            elif [ "$PKG_MGR" = "pnpm" ]; then
              CMD="pnpm run lint"
            else
              CMD="npm run lint"
            fi
          fi
          TRIMMED="${CMD//[[:space:]]/}"
          if [ -z "$TRIMMED" ] || [ "$TRIMMED" = "true" ] || [ "$TRIMMED" = ":" ]; then
            echo "::error::Invalid lint command '$TRIMMED'. Disable lint explicitly with disabled-check-reasons instead of using fake-green commands."
            exit 1
          fi
          echo "Running lint: $CMD"
          bash -euo pipefail -c "$CMD"

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # L1: Unit tests + coverage. The job always runs so it can
  # validate disabled-check-reasons; the unit step itself is
  # skipped when the slot is disabled.
  # ─────────────────────────────────────────────────────
  l1-unit-tests:
    name: "L1: Unit Tests & Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
      l1-unit: ${{ steps.l1-unit.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          env-json: ${{ inputs.env-json }}

      - name: Validate disabled checks explanations
        shell: bash
        env:
          IN_REASONS: ${{ inputs.disabled-check-reasons }}
          TYPECHECK_ENABLED: ${{ inputs.typecheck }}
          LINT_ENABLED: ${{ inputs.lint }}
          UNIT_ENABLED: ${{ inputs.unit }}
          SECURITY_ENABLED: ${{ inputs.security }}
        run: |
          set -euo pipefail
          python3 -c '
          import os, sys, json
          reasons_str = os.environ.get("IN_REASONS", "{}")
          try:
              reasons = json.loads(reasons_str) if reasons_str else {}
          except Exception as e:
              sys.stderr.write(f"::error::disabled-check-reasons is invalid JSON: {e}\n")
              sys.exit(1)

          checks = {
              "typecheck": os.environ.get("TYPECHECK_ENABLED") == "true",
              "lint": os.environ.get("LINT_ENABLED") == "true",
              "unit": os.environ.get("UNIT_ENABLED") == "true",
              "security": os.environ.get("SECURITY_ENABLED") == "true",
          }
          for name, enabled in checks.items():
              if not enabled:
                  if name not in reasons or not str(reasons[name]).strip():
                      sys.stderr.write(f"::error::Core check \"{name}\" is disabled but missing explanation in disabled-check-reasons\n")
                      sys.exit(1)
                  print(f"Check {name} is explicitly disabled: {reasons[name]}")
          '

      - name: Prepare environment
        if: inputs.prepare-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_PREPARE: ${{ inputs.prepare-command }}
        run: |
          echo "Executing prepare-command..."
          bash -euo pipefail -c "$IN_PREPARE"

      - name: "L1: Unit Tests & Coverage"
        id: l1-unit
        if: inputs.unit
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_CMD: ${{ inputs.test-command }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          CMD="$IN_CMD"
          if [ -z "$CMD" ]; then
            if [ "$PKG_MGR" = "bun" ]; then
              CMD="bun run test:coverage"
            elif [ "$PKG_MGR" = "pnpm" ]; then
              CMD="pnpm run test:coverage"
            else
              CMD="npm run test:coverage"
            fi
          fi
          TRIMMED="${CMD//[[:space:]]/}"
          if [ -z "$TRIMMED" ] || [ "$TRIMMED" = "true" ] || [ "$TRIMMED" = ":" ]; then
            echo "::error::Invalid test command '$TRIMMED'. Disable unit explicitly with disabled-check-reasons instead of using fake-green commands."
            exit 1
          fi
          echo "Running unit tests: $CMD"
          bash -euo pipefail -c "$CMD"

      - name: Upload coverage
        if: inputs.unit && inputs.coverage-path != '' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: ${{ inputs.coverage-path }}
          retention-days: 7
          if-no-files-found: error

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # S3: Workflow lint (optional)
  # ─────────────────────────────────────────────────────
  s3-workflow-lint:
    name: "S3: Workflow Lint"
    if: inputs.workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

      - name: Validate workflow syntax
        shell: bash
        env:
          WORKFLOW_FILES: ${{ inputs.workflow-lint-files }}
        run: |
          set -euo pipefail
          read -r -a files <<< "$WORKFLOW_FILES"
          if [ "${#files[@]}" -eq 0 ]; then
            "$RUNNER_TEMP/actionlint"
          else
            "$RUNNER_TEMP/actionlint" "${files[@]}"
          fi

      - name: Check immutable shared workflow references
        shell: bash
        env:
          WORKFLOW_FILES: ${{ inputs.workflow-lint-files }}
          REQUIRED_WORKFLOW: ${{ inputs.workflow-lint-required-workflow }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, yaml
          files = os.environ['WORKFLOW_FILES'].split() or list(pathlib.Path('.github/workflows').glob('*.y*ml'))
          references = []
          for path in files:
              data = yaml.safe_load(pathlib.Path(path).read_text())
              for job in data.get('jobs', {}).values():
                  references.extend(item['uses'] for item in [job, *job.get('steps', [])] if 'uses' in item)
          for ref in references:
              if ref.startswith('nocoo/base-ci/') and not re.fullmatch(r'nocoo/base-ci/[^@]+@[a-f0-9]{40}', ref):
                  raise SystemExit(f'Shared CI reference must use a full commit SHA: {ref}')
          required = os.environ['REQUIRED_WORKFLOW']
          if required and not any(ref.startswith(required + '@') for ref in references):
              raise SystemExit(f'Missing required reusable workflow: {required}')
          print(f'Validated {len(files)} workflow files and immutable base-ci references')
          PY

      - name: Check YAML style
        if: inputs.workflow-lint-yamllint
        shell: bash
        env:
          WORKFLOW_FILES: ${{ inputs.workflow-lint-files }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'yamllint==1.38.0'
          read -r -a files <<< "$WORKFLOW_FILES"
          if [ "${#files[@]}" = 0 ]; then files=(.github/workflows/*.yml); fi
          yamllint -d '{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}' "${files[@]}"

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # G1: Secret scan
  # ─────────────────────────────────────────────────────
  g1-secret-scan:
    name: "G1: Secret Scan"
    if: inputs.security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup JS and dependencies (if security-command requires runtime)
        if: inputs.security-command != ''
        uses: nocoo/base-ci/.github/actions/setup-js@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Install security scanners (gitleaks + osv-scanner)
        uses: nocoo/base-ci/.github/actions/setup-security-scanners@2231caf82cf16f103f48cab467b3464b106d6604

      - name: "G1: Gitleaks Secret Scan"
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_GITLEAKS_CONFIG: ${{ inputs.gitleaks-config }}
          IN_GITLEAKS_IGNORE: ${{ inputs.gitleaks-ignore-path }}
        run: |
          set -euo pipefail
          GITLEAKS_ARGS="detect --no-banner --verbose --redact --no-git"
          if [ -n "$IN_GITLEAKS_CONFIG" ]; then
            GITLEAKS_ARGS="$GITLEAKS_ARGS --config=$IN_GITLEAKS_CONFIG"
          elif [ -f ".gitleaks.toml" ]; then
            GITLEAKS_ARGS="$GITLEAKS_ARGS --config=.gitleaks.toml"
          fi
          if [ -n "$IN_GITLEAKS_IGNORE" ]; then
            GITLEAKS_ARGS="$GITLEAKS_ARGS --gitleaks-ignore-path=$IN_GITLEAKS_IGNORE"
          elif [ -f ".gitleaksignore" ]; then
            GITLEAKS_ARGS="$GITLEAKS_ARGS --gitleaks-ignore-path=.gitleaksignore"
          fi
          echo "Running gitleaks with args: $GITLEAKS_ARGS"
          gitleaks $GITLEAKS_ARGS

      - name: Custom security command
        if: inputs.security-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_SEC_CMD: ${{ inputs.security-command }}
          CI: "true"
        run: |
          echo "Running custom security command..."
          bash -euo pipefail -c "$IN_SEC_CMD"

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # G2: Dependency vulnerabilities
  # ─────────────────────────────────────────────────────
  g2-dependency-vulnerabilities:
    name: "G2: Dependency Vulnerabilities"
    if: inputs.security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install security scanners (gitleaks + osv-scanner)
        uses: nocoo/base-ci/.github/actions/setup-security-scanners@2231caf82cf16f103f48cab467b3464b106d6604

      - name: "G2: OSV Dependency Scan"
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_LOCKFILES: ${{ inputs.lockfiles != '' && inputs.lockfiles || (inputs.package-manager == 'bun' && 'bun.lock' || (inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json')) }}
          IN_OSV_CONFIG: ${{ inputs.osv-config }}
        run: |
          set -euo pipefail

          LOCKFILES=()
          while IFS= read -r line || [ -n "$line" ]; do
            TRIMMED="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -n "$TRIMMED" ]; then
              LOCKFILES+=("$TRIMMED")
            fi
          done < <(printf '%s\n' "$IN_LOCKFILES" | tr ',' '\n')

          if [ ${#LOCKFILES[@]} -eq 0 ]; then
            echo "::error::No lockfiles specified for OSV scan."
            exit 1
          fi

          OSV_BASE_ARGS=""
          if [ -n "$IN_OSV_CONFIG" ]; then
            OSV_BASE_ARGS="--config=$IN_OSV_CONFIG"
          fi

          for lf in "${LOCKFILES[@]}"; do
            if [ ! -f "$lf" ]; then
              echo "::error::Lockfile '$lf' does not exist."
              exit 1
            fi
            echo "::group::Scanning lockfile: $lf"
            if [ -n "$OSV_BASE_ARGS" ]; then
              osv-scanner scan --lockfile="$lf" $OSV_BASE_ARGS
            else
              osv-scanner scan --lockfile="$lf"
            fi
            echo "::endgroup::"
          done

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # B1: Build (optional)
  # ─────────────────────────────────────────────────────
  b1-build:
    name: "B1: Build"
    if: inputs.build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload-artifact-step.outputs.artifact-id }}
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          env-json: ${{ inputs.env-json }}

      - name: Prepare environment
        if: inputs.prepare-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_PREPARE: ${{ inputs.prepare-command }}
        run: |
          echo "Executing prepare-command..."
          bash -euo pipefail -c "$IN_PREPARE"

      - name: Execute build
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_BUILD: ${{ inputs.build-command }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          CMD="$IN_BUILD"
          if [ -z "$CMD" ]; then
            if [ "$PKG_MGR" = "bun" ]; then
              CMD="bun run build"
            elif [ "$PKG_MGR" = "pnpm" ]; then
              CMD="pnpm run build"
            else
              CMD="npm run build"
            fi
          fi
          echo "Running build: $CMD"
          bash -euo pipefail -c "$CMD"

      - name: Upload build artifact
        id: upload-artifact-step
        if: inputs.artifact-paths != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name != '' && inputs.artifact-name || 'build-artifact' }}
          path: ${{ inputs.artifact-paths }}
          retention-days: 7
          if-no-files-found: error

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # L2: API E2E (optional)
  # ─────────────────────────────────────────────────────
  l2-api-e2e:
    name: "L2: API E2E"
    if: inputs.l2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          env-json: ${{ inputs.env-json }}
          secret-env-json: ${{ secrets.test-env-json }}

      - name: Prepare environment
        if: inputs.prepare-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_PREPARE: ${{ inputs.prepare-command }}
        run: |
          echo "Executing prepare-command..."
          bash -euo pipefail -c "$IN_PREPARE"

      - name: "L2: API E2E"
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_CMD: ${{ inputs.l2-command != '' && inputs.l2-command || (inputs.package-manager == 'bun' && 'bun run test:api' || 'npm run test:api') }}
        run: |
          set -euo pipefail
          echo "Running L2 API E2E: $IN_CMD"
          bash -euo pipefail -c "$IN_CMD"

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload L2 evidence
        if: always() && inputs.l2-artifact-name != '' && inputs.l2-artifact-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.l2-artifact-name }}
          path: ${{ inputs.l2-artifact-path }}
          retention-days: ${{ inputs.l2-artifact-retention-days }}
          if-no-files-found: error

  # ─────────────────────────────────────────────────────
  # L3: Browser E2E with Playwright (optional)
  # ─────────────────────────────────────────────────────
  l3-browser-e2e:
    name: "L3: Browser E2E"
    if: inputs.l3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          env-json: ${{ inputs.env-json }}
          secret-env-json: ${{ secrets.test-env-json }}

      - name: Prepare environment
        if: inputs.l3-prepare-command != '' || inputs.prepare-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_PREPARE: ${{ inputs.l3-prepare-command != '' && inputs.l3-prepare-command || inputs.prepare-command }}
        run: |
          echo "Executing L3 prepare-command..."
          bash -euo pipefail -c "$IN_PREPARE"

      - name: Install Playwright browsers
        if: inputs.l3-browsers != '' || inputs.l3-browser != ''
        shell: bash
        working-directory: ${{ inputs.l3-browser-directory != '' && inputs.l3-browser-directory || inputs.working-directory }}
        env:
          IN_BROWSERS: ${{ inputs.l3-browsers != '' && inputs.l3-browsers || inputs.l3-browser }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          read -r -a BROWSERS <<< "$IN_BROWSERS"
          if [ "${#BROWSERS[@]}" -eq 0 ]; then
            echo "::error::No Playwright browser requested."
            exit 1
          fi
          echo "Installing Playwright browsers: ${BROWSERS[*]}"
          if [ "$PKG_MGR" = "bun" ]; then
            bunx playwright install --with-deps "${BROWSERS[@]}"
          elif [ "$PKG_MGR" = "pnpm" ]; then
            pnpm exec playwright install --with-deps "${BROWSERS[@]}"
          else
            npx playwright install --with-deps "${BROWSERS[@]}"
          fi

      - name: "L3: Browser E2E"
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_CMD: ${{ inputs.l3-command != '' && inputs.l3-command || (inputs.package-manager == 'bun' && 'bun run test:e2e:pw' || 'npm run test:e2e:pw') }}
        run: |
          set -euo pipefail
          echo "Running L3 browser E2E: $IN_CMD"
          bash -euo pipefail -c "$IN_CMD"

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload L3 evidence
        if: always() && inputs.l3-artifact-name != '' && inputs.l3-artifact-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.l3-artifact-name }}
          path: ${{ inputs.l3-artifact-path }}
          retention-days: ${{ inputs.l3-artifact-retention-days }}
          if-no-files-found: error

  # ─────────────────────────────────────────────────────
  # L1.5: Worker runtime tests (optional)
  # ─────────────────────────────────────────────────────
  l15-worker-runtime:
    name: "L1.5: Worker Runtime Tests"
    if: inputs.worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.worker-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          env-json: ${{ inputs.env-json }}
          secret-env-json: ${{ secrets.test-env-json }}

      - name: Prepare environment
        if: inputs.worker-prepare-command != ''
        shell: bash
        working-directory: ${{ inputs.worker-directory }}
        env:
          IN_PREPARE: ${{ inputs.worker-prepare-command }}
        run: |
          echo "Executing worker-prepare-command..."
          bash -euo pipefail -c "$IN_PREPARE"

      - name: "L1.5: Worker Runtime Tests"
        shell: bash
        working-directory: ${{ inputs.worker-directory }}
        env:
          IN_CMD: ${{ inputs.worker-command != '' && inputs.worker-command || (inputs.package-manager == 'bun' && 'bun run test' || 'npm run test') }}
        run: |
          set -euo pipefail
          echo "Running worker runtime tests: $IN_CMD"
          bash -euo pipefail -c "$IN_CMD"

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # P1: Package check (optional)
  # ─────────────────────────────────────────────────────
  p1-package-check:
    name: "P1: Package Check"
    if: inputs.package-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          env-json: ${{ inputs.env-json }}
          secret-env-json: ${{ secrets.test-env-json }}

      - name: Prepare environment
        if: inputs.prepare-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_PREPARE: ${{ inputs.prepare-command }}
        run: |
          echo "Executing prepare-command..."
          bash -euo pipefail -c "$IN_PREPARE"

      - name: "P1: Package Check"
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_CMD: ${{ inputs.package-command != '' && inputs.package-command || (inputs.package-manager == 'bun' && 'bun run ci:package' || 'npm run ci:package') }}
        run: |
          set -euo pipefail
          echo "Running package check: $IN_CMD"
          bash -euo pipefail -c "$IN_CMD"

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # Z1 Gate: verifies the slot declarations against the jobs
  # that actually ran, then emits the shared tested SHA
  # ─────────────────────────────────────────────────────
  z1-gate:
    name: "Z1: Gate"
    needs: [s1-typecheck, s2-lint, s3-workflow-lint, g1-secret-scan, g2-dependency-vulnerabilities, b1-build, l1-unit-tests, l15-worker-runtime, l2-api-e2e, l3-browser-e2e, p1-package-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.verify-all.outputs.tested-sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify slot declarations and gate results
        id: verify-all
        shell: bash
        env:
          SLOT_STATUS: ${{ inputs.slot-status }}
          SLOT_S1_ENABLED: ${{ inputs.typecheck }}
          SLOT_S1_OUTCOME: ${{ needs.s1-typecheck.result }}
          SLOT_S1_SHA: ${{ needs.s1-typecheck.outputs.tested-sha }}
          SLOT_S2_ENABLED: ${{ inputs.lint }}
          SLOT_S2_OUTCOME: ${{ needs.s2-lint.result }}
          SLOT_S2_SHA: ${{ needs.s2-lint.outputs.tested-sha }}
          SLOT_S3_ENABLED: ${{ inputs.workflow-lint }}
          SLOT_S3_OUTCOME: ${{ needs.s3-workflow-lint.result }}
          SLOT_S3_SHA: ${{ needs.s3-workflow-lint.outputs.tested-sha }}
          SLOT_G1_ENABLED: ${{ inputs.security }}
          SLOT_G1_OUTCOME: ${{ needs.g1-secret-scan.result }}
          SLOT_G1_SHA: ${{ needs.g1-secret-scan.outputs.tested-sha }}
          SLOT_G2_ENABLED: ${{ inputs.security }}
          SLOT_G2_OUTCOME: ${{ needs.g2-dependency-vulnerabilities.result }}
          SLOT_G2_SHA: ${{ needs.g2-dependency-vulnerabilities.outputs.tested-sha }}
          SLOT_B1_ENABLED: ${{ inputs.build }}
          SLOT_B1_OUTCOME: ${{ needs.b1-build.result }}
          SLOT_B1_SHA: ${{ needs.b1-build.outputs.tested-sha }}
          SLOT_L1_ENABLED: ${{ inputs.unit }}
          SLOT_L1_OUTCOME: ${{ needs.l1-unit-tests.outputs.l1-unit }}
          SLOT_L1_SHA: ${{ needs.l1-unit-tests.outputs.tested-sha }}
          SLOT_L1_JOB_RESULT: ${{ needs.l1-unit-tests.result }}
          SLOT_L15_ENABLED: ${{ inputs.worker }}
          SLOT_L15_OUTCOME: ${{ needs.l15-worker-runtime.result }}
          SLOT_L15_SHA: ${{ needs.l15-worker-runtime.outputs.tested-sha }}
          SLOT_L2_ENABLED: ${{ inputs.l2 }}
          SLOT_L2_OUTCOME: ${{ needs.l2-api-e2e.result }}
          SLOT_L2_SHA: ${{ needs.l2-api-e2e.outputs.tested-sha }}
          SLOT_L3_ENABLED: ${{ inputs.l3 }}
          SLOT_L3_OUTCOME: ${{ needs.l3-browser-e2e.result }}
          SLOT_L3_SHA: ${{ needs.l3-browser-e2e.outputs.tested-sha }}
          SLOT_P1_ENABLED: ${{ inputs.package-check }}
          SLOT_P1_OUTCOME: ${{ needs.p1-package-check.result }}
          SLOT_P1_SHA: ${{ needs.p1-package-check.outputs.tested-sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          # SLOT_GATE_PYTHON_BEGIN
          import json
          import os
          import sys

          SLOT_IDS = ["S1", "S2", "S3", "G1", "G2", "B1", "L1", "L1.5", "L2", "L3", "P1", "Z1"]
          SLOT_KEYS = {
              "S1": "S1",
              "S2": "S2",
              "S3": "S3",
              "G1": "G1",
              "G2": "G2",
              "B1": "B1",
              "L1": "L1",
              "L1.5": "L15",
              "L2": "L2",
              "L3": "L3",
              "P1": "P1",
          }
          VALID_STATUSES = ("impl", "na", "todo")


          def fail(message):
              sys.stderr.write(f"::error::{message}\n")
              sys.exit(1)


          def collect_slots():
              slots = {}
              for slot in SLOT_IDS:
                  if slot == "Z1":
                      slots[slot] = {"enabled": True, "outcome": "success", "sha": ""}
                      continue
                  key = SLOT_KEYS[slot]
                  enabled = os.environ.get(f"SLOT_{key}_ENABLED", "")
                  outcome = os.environ.get(f"SLOT_{key}_OUTCOME", "") or "not_run"
                  sha = os.environ.get(f"SLOT_{key}_SHA", "")
                  slots[slot] = {"enabled": enabled == "true", "outcome": outcome, "sha": sha}
              return slots


          def require_l1_job():
              result = os.environ.get("SLOT_L1_JOB_RESULT", "")
              if result != "success":
                  fail(f"The L1 job finished with result '{result}'")
              if not os.environ.get("SLOT_L1_SHA", ""):
                  fail("The L1 job did not report a tested SHA")


          def verify_legacy(slots):
              require_l1_job()
              verified = []
              for slot in SLOT_IDS:
                  if slot == "Z1":
                      continue
                  state = slots[slot]
                  if state["enabled"]:
                      if state["outcome"] != "success":
                          fail(f"Required slot {slot} finished with outcome '{state['outcome']}'")
                      if not state["sha"]:
                          fail(f"Required slot {slot} did not report a tested SHA")
                      verified.append((slot, state["sha"]))
                  elif state["outcome"] not in ("skipped", "not_run"):
                      fail(f"Disabled slot {slot} was not skipped (outcome '{state['outcome']}')")
              verified.append(("L1 job", os.environ["SLOT_L1_SHA"]))
              return verified


          def verify_strict(raw, slots):
              require_l1_job()
              try:
                  declarations = json.loads(raw)
              except json.JSONDecodeError as exc:
                  fail(f"slot-status is not valid JSON: {exc}")
              if not isinstance(declarations, dict):
                  fail("slot-status must be a JSON object")
              unknown = sorted(set(declarations) - set(SLOT_IDS))
              if unknown:
                  fail(f"slot-status declares unknown slots: {', '.join(unknown)}")
              missing = [slot for slot in SLOT_IDS if slot not in declarations]
              if missing:
                  fail(f"slot-status is missing slot declarations: {', '.join(missing)}")
              for slot in SLOT_IDS:
                  entry = declarations[slot]
                  if not isinstance(entry, dict):
                      fail(f"slot-status entry for {slot} must be an object")
                  status = entry.get("status")
                  if status not in VALID_STATUSES:
                      fail(f"slot-status entry for {slot} has an invalid status '{status}'")
                  if status in ("na", "todo"):
                      reason = entry.get("reason")
                      if not isinstance(reason, str) or not reason.strip():
                          fail(f"slot-status entry for {slot} requires a non-empty reason")
                  if slot == "Z1" and status != "impl":
                      fail("slot-status entry for Z1 must be impl")
              verified = []
              for slot in SLOT_IDS:
                  if slot == "Z1":
                      continue
                  status = declarations[slot]["status"]
                  state = slots[slot]
                  if status == "impl":
                      if not state["enabled"]:
                          fail(f"Slot {slot} is declared impl but its job or step is not enabled")
                      if state["outcome"] != "success":
                          fail(f"Slot {slot} is declared impl but finished with outcome '{state['outcome']}'")
                      if not state["sha"]:
                          fail(f"Slot {slot} is declared impl but did not report a tested SHA")
                      verified.append((slot, state["sha"]))
                  else:
                      if state["enabled"]:
                          fail(f"Slot {slot} is declared {status} but its job or step is enabled")
                      if state["outcome"] not in ("skipped", "not_run"):
                          fail(f"Slot {slot} is declared {status} but its job or step ran with outcome '{state['outcome']}'")
              if not verified:
                  fail("slot-status declares no implemented slot besides Z1")
              verified.append(("L1 job", os.environ["SLOT_L1_SHA"]))
              return verified


          def main():
              raw = os.environ.get("SLOT_STATUS", "")
              slots = collect_slots()
              if raw == "":
                  mode = "legacy"
                  verified = verify_legacy(slots)
              else:
                  mode = "strict"
                  verified = verify_strict(raw, slots)
              first_slot, first_sha = verified[0]
              for slot, sha in verified[1:]:
                  if sha != first_sha:
                      fail(f"Commit SHA mismatch between slot {first_slot} and slot {slot}")
              print(f"Slot gate mode: {mode}")
              for slot in SLOT_IDS:
                  state = slots[slot]
                  print(f"  {slot:5} enabled={str(state['enabled']):5} outcome={state['outcome']:10} sha={state['sha']}")
              print(f"All {len(verified)} verified slots agree on commit SHA: {first_sha}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"tested-sha={first_sha}\n")


          main()
          # SLOT_GATE_PYTHON_END
          PY
