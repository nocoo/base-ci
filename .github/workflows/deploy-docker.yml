name: Deploy Docker

on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: production
      images:
        description: JSON array of image, service, context, file, build-args, and optional cache-scope objects
        type: string
        required: true
      deploy-over-ssh:
        description: Deploy pushed GHCR images to a host over SSH (false for registry push-only)
        type: boolean
        default: true
      deploy-directory:
        type: string
        required: false
        default: ''
      remote-verify-command:
        description: Project health checks executed in the server deployment directory (required when deploy-over-ssh is true)
        type: string
        required: false
        default: ''
      verify-command:
        description: Mandatory post-deploy or post-push verification command
        type: string
        required: true
      timeout-minutes:
        type: number
        default: 25
      tailscale:
        description: Join the Tailscale tailnet via workload identity federation before SSH (requires TS_OAUTH_CLIENT_ID and TS_AUDIENCE secrets)
        type: boolean
        default: false
      tailscale-tags:
        description: Comma-separated Tailscale tags for the ephemeral CI node (must exist in the tailnet)
        type: string
        default: tag:ci
      tailscale-ping:
        description: Optional comma-separated peers to ping after joining (defaults to VPS_HOST when tailscale is true)
        type: string
        default: ''
      auto-rollback:
        description: Automatically restore the previous recorded release manifest on host if remote verify or D5 fails
        type: boolean
        default: false
      rollback-sha:
        description: Optional previously deployed 40-char SHA in .base-ci-releases/<sha>.json; skips D2 build and rolls back directly
        type: string
        default: ''
    secrets:
      VPS_HOST:
        required: false
      VPS_USER:
        required: false
      VPS_SSH_KEY:
        required: false
      VPS_PORT:
        required: false
      VPS_KNOWN_HOSTS:
        required: false
      GHCR_PULL_USER:
        required: false
      GHCR_PULL_TOKEN:
        required: false
      BUILD_ARGS:
        description: Additional Docker build arguments supplied by the caller
        required: false
      TS_OAUTH_CLIENT_ID:
        description: Tailscale federated identity client ID (workload identity federation; not the OAuth client secret path)
        required: false
      TS_AUDIENCE:
        description: Tailscale federated identity audience for GitHub workload identity
        required: false
    outputs:
      target-sha:
        value: ${{ jobs.d1-preflight.outputs.sha }}
      source-run-id:
        value: ${{ jobs.d1-preflight.outputs.run-id }}
      release-images:
        value: ${{ jobs.d4-deploy.outputs.release-images }}

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: base-ci-docker-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  d1-preflight:
    name: "D1: Preflight"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ github.sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
      run-id: ${{ format('{0}', github.run_id) }}
      rollback-sha: ${{ inputs.rollback-sha }}
    steps:
      - name: Verify main ref and required inputs
        env:
          GITHUB_REF: ${{ github.ref }}
          DEPLOY_OVER_SSH: ${{ inputs.deploy-over-ssh }}
          DEPLOY_DIRECTORY: ${{ inputs.deploy-directory }}
          REMOTE_VERIFY_COMMAND: ${{ inputs.remote-verify-command }}
          VERIFY_COMMAND: ${{ inputs.verify-command }}
          ROLLBACK_SHA: ${{ inputs.rollback-sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::deploy-docker must run only on refs/heads/main (got $GITHUB_REF)"
            exit 1
          fi
          if [ -z "${VERIFY_COMMAND// /}" ]; then
            echo "::error::verify-command is mandatory (D5: Verify)"
            exit 1
          fi
          if [ "$DEPLOY_OVER_SSH" = "true" ]; then
            if [ -z "${DEPLOY_DIRECTORY// /}" ] || [ -z "${REMOTE_VERIFY_COMMAND// /}" ]; then
              echo "::error::deploy-directory and remote-verify-command are required when deploy-over-ssh is true"
              exit 1
            fi
          fi
          if [ -n "${ROLLBACK_SHA// /}" ]; then
            if [[ ! "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::rollback-sha must be a 40-character lowercase git commit SHA"
              exit 1
            fi
            if [ "$DEPLOY_OVER_SSH" != "true" ]; then
              echo "::error::rollback-sha requires deploy-over-ssh: true"
              exit 1
            fi
          fi
      - id: plan
        uses: nocoo/base-ci/.github/actions/docker-manifest@a613758b5ee8533dfdf0289e6cade788dbf8e2dc
        with:
          images: ${{ inputs.images }}
          source-sha: ${{ github.sha }}

  d2-artifact:
    name: "D2: Artifact"
    if: inputs.rollback-sha == ''
    needs: d1-preflight
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.d1-preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.d1-preflight.outputs.sha }}
          persist-credentials: false
          filter: blob:none
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: shortsha
        env:
          SHA: ${{ needs.d1-preflight.outputs.sha }}
        run: echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
      - id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: true
          build-args: |
            ${{ matrix.image.build-args }}
            ${{ secrets.BUILD_ARGS }}
          tags: |
            ${{ matrix.image.image }}:${{ needs.d1-preflight.outputs.sha }}
            ${{ matrix.image.image }}:sha-${{ steps.shortsha.outputs.short }}
            ${{ matrix.image.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ needs.d1-preflight.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image.cacheScope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.cacheScope }}
      - name: "D5: Verify — Registry image check"
        if: ${{ !inputs.deploy-over-ssh }}
        env:
          SOURCE_SHA: ${{ needs.d1-preflight.outputs.sha }}
          IMAGE_NAME: ${{ matrix.image.image }}
          IMAGE_SERVICE: ${{ matrix.image.service }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REF: ${{ matrix.image.image }}@${{ steps.image.outputs.digest }}
          VERIFY_COMMAND: ${{ inputs.verify-command }}
        run: bash -euo pipefail -c "$VERIFY_COMMAND"
      - name: Record built image digest
        if: inputs.deploy-over-ssh
        env:
          RELEASE_IMAGE: ${{ matrix.image.image }}
          RELEASE_SERVICE: ${{ matrix.image.service }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_SOURCE_SHA: ${{ needs.d1-preflight.outputs.sha }}
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, writeFileSync } from 'node:fs';
          const { RELEASE_IMAGE: image, RELEASE_SERVICE: service, RELEASE_DIGEST: digest, RELEASE_SOURCE_SHA: sourceSha } = process.env;
          mkdirSync('base-ci-digests', { recursive: true });
          writeFileSync(`base-ci-digests/${service}.json`, JSON.stringify({ image, service, digest, sourceSha }));
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.deploy-over-ssh
        with:
          name: base-ci-image-${{ matrix.image.service }}-${{ needs.d1-preflight.outputs.sha }}
          path: base-ci-digests/*.json
          if-no-files-found: error
          retention-days: 14

  d4-deploy:
    name: "D4: Deploy"
    if: ${{ inputs.deploy-over-ssh && !failure() && !cancelled() && (needs.d2-artifact.result == 'success' || (inputs.rollback-sha != '' && needs.d2-artifact.result == 'skipped')) }}
    needs: [d1-preflight, d2-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      release-images: ${{ steps.manifest.outputs.release-images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.d1-preflight.outputs.sha }}
          persist-credentials: false
          filter: blob:none
      - name: "D1: Preflight — Validate deployment credentials"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          TAILSCALE: ${{ inputs.tailscale }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY GHCR_PULL_USER GHCR_PULL_TOKEN; do
            test -n "${!name}" || { echo "::error::Missing deployment credential: $name"; exit 1; }
          done
          if [ "$TAILSCALE" = "true" ]; then
            for name in TS_OAUTH_CLIENT_ID TS_AUDIENCE; do
              test -n "${!name}" || { echo "::error::Missing Tailscale federation secret: $name (see deploy-docker tailscale inputs)"; exit 1; }
            done
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.rollback-sha == ''
        with:
          pattern: base-ci-image-*-${{ needs.d1-preflight.outputs.sha }}
          path: base-ci-digests
          merge-multiple: true
      - id: manifest
        if: inputs.rollback-sha == ''
        uses: nocoo/base-ci/.github/actions/docker-manifest@a613758b5ee8533dfdf0289e6cade788dbf8e2dc
        with:
          images: ${{ inputs.images }}
          source-sha: ${{ needs.d1-preflight.outputs.sha }}
          directory: base-ci-digests
      - name: Connect Tailscale
        if: inputs.tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: ${{ inputs.tailscale-tags }}
          ping: ${{ inputs.tailscale-ping != '' && inputs.tailscale-ping || secrets.VPS_HOST }}
      - name: Wait for SSH reachability
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if nc -z -w 5 "$VPS_HOST" "$VPS_PORT" 2>/dev/null; then exit 0; fi
            if [ "$attempt" != 6 ]; then sleep 5; fi
          done
          echo '::error::SSH host is unreachable'
          exit 1
      - name: Deploy verified images
        uses: nocoo/base-ci/.github/actions/ssh-deploy@a613758b5ee8533dfdf0289e6cade788dbf8e2dc
        env:
          IMAGE_SHA: ${{ needs.d1-preflight.outputs.sha }}
          RELEASE_IMAGES: ${{ steps.manifest.outputs.release-images }}
          DEPLOY_DIRECTORY: ${{ inputs.deploy-directory }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          REMOTE_VERIFY_COMMAND: ${{ inputs.remote-verify-command }}
          AUTO_ROLLBACK: ${{ inputs.auto-rollback }}
          ROLLBACK_SHA: ${{ inputs.rollback-sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          envs: IMAGE_SHA RELEASE_IMAGES DEPLOY_DIRECTORY GHCR_PULL_USER GHCR_PULL_TOKEN REMOTE_VERIFY_COMMAND AUTO_ROLLBACK ROLLBACK_SHA
          script: |
            set -euo pipefail
            umask 077
            cd -- "$DEPLOY_DIRECTORY"
            command -v python3 >/dev/null
            printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_PULL_USER" --password-stdin
            mkdir -p .base-ci-releases

            apply_manifest() {
              local manifest_json="$1"
              local pull_images="$2"
              local workdir
              workdir="$(mktemp -d .base-ci-deploy.XXXXXX)"
              docker compose config --format json > "$workdir/current.json"
              RELEASE_MANIFEST_JSON="$manifest_json" python3 - "$workdir" <<'PY'
            import json, os, pathlib, sys
            root = pathlib.Path(sys.argv[1])
            config = json.loads((root / 'current.json').read_text())
            images = json.loads(os.environ['RELEASE_MANIFEST_JSON'])
            for entry in images:
                service = entry['service']
                if service not in config['services']:
                    raise SystemExit(f'Unknown Compose service: {service}')
                config['services'][service]['image'] = entry['image'] + '@' + entry['digest']
            (root / 'release.json').write_text(json.dumps(config))
            (root / 'services').write_text('\n'.join(x['service'] for x in images) + '\n')
            PY
              local services=()
              while IFS= read -r service; do
                services+=("$service")
                if [ "$pull_images" = "1" ]; then
                  docker compose --project-directory "$PWD" -f "$workdir/release.json" pull "$service"
                fi
              done < "$workdir/services"
              docker compose --project-directory "$PWD" -f "$workdir/release.json" up -d --no-deps "${services[@]}"
              rm -rf "$workdir"
            }

            if [ -n "${ROLLBACK_SHA:-}" ]; then
              manifest_file=".base-ci-releases/$ROLLBACK_SHA.json"
              if [ ! -s "$manifest_file" ]; then
                echo "::error::Missing release manifest for rollback-sha: $manifest_file"
                exit 1
              fi
              target_manifest="$(cat "$manifest_file")"
              apply_manifest "$target_manifest" 1
              bash -euo pipefail -c "$REMOTE_VERIFY_COMMAND"
              cp "$manifest_file" .base-ci-releases/current.json
              exit 0
            fi

            prev_snapshot=".base-ci-releases/.prev-for-$IMAGE_SHA.json"
            rm -f "$prev_snapshot"
            if [ -s .base-ci-releases/current.json ]; then
              cp .base-ci-releases/current.json "$prev_snapshot"
            else
              prev_candidate=""
              for f in $(ls -1t .base-ci-releases/*.json 2>/dev/null || true); do
                base="$(basename "$f")"
                case "$base" in
                  current.json|previous.json|.prev-*|"$IMAGE_SHA.json") continue ;;
                  *) prev_candidate="$f"; break ;;
                esac
              done
              if [ -n "$prev_candidate" ] && [ -s "$prev_candidate" ]; then
                cp "$prev_candidate" "$prev_snapshot"
              fi
            fi

            apply_manifest "$RELEASE_IMAGES" 1
            if ! bash -euo pipefail -c "$REMOTE_VERIFY_COMMAND"; then
              if [ "${AUTO_ROLLBACK:-false}" = "true" ] && [ -s "$prev_snapshot" ]; then
                echo "::warning::Remote verify failed; restoring previous Docker release from $prev_snapshot"
                apply_manifest "$(cat "$prev_snapshot")" 0
                bash -euo pipefail -c "$REMOTE_VERIFY_COMMAND" || true
              fi
              exit 1
            fi

            if [ -s .base-ci-releases/current.json ]; then
              cp .base-ci-releases/current.json .base-ci-releases/previous.json
            fi
            printf '%s\n' "$RELEASE_IMAGES" > ".base-ci-releases/$IMAGE_SHA.json"
            printf '%s\n' "$RELEASE_IMAGES" > .base-ci-releases/current.json
      - name: "D5: Verify — Production health check"
        id: d5-verify
        env:
          SOURCE_SHA: ${{ needs.d1-preflight.outputs.rollback-sha != '' && needs.d1-preflight.outputs.rollback-sha || needs.d1-preflight.outputs.sha }}
          RELEASE_IMAGES: ${{ steps.manifest.outputs.release-images }}
          VERIFY_COMMAND: ${{ inputs.verify-command }}
          DEPLOY_PHASE: ${{ vars.DEPLOY_PHASE }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_ORIGIN_MARKER: ${{ vars.DEPLOY_ORIGIN_MARKER }}
        run: bash -euo pipefail -c "$VERIFY_COMMAND"
      - name: "D5: Auto-Rollback — Restore previous Docker release"
        if: ${{ failure() && inputs.auto-rollback && inputs.rollback-sha == '' && steps.d5-verify.outcome == 'failure' }}
        uses: nocoo/base-ci/.github/actions/ssh-deploy@a613758b5ee8533dfdf0289e6cade788dbf8e2dc
        env:
          IMAGE_SHA: ${{ needs.d1-preflight.outputs.sha }}
          DEPLOY_DIRECTORY: ${{ inputs.deploy-directory }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          REMOTE_VERIFY_COMMAND: ${{ inputs.remote-verify-command }}
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          envs: IMAGE_SHA DEPLOY_DIRECTORY GHCR_PULL_USER GHCR_PULL_TOKEN REMOTE_VERIFY_COMMAND
          script: |
            set -euo pipefail
            umask 077
            cd -- "$DEPLOY_DIRECTORY"
            command -v python3 >/dev/null
            prev_file=".base-ci-releases/.prev-for-$IMAGE_SHA.json"
            if [ ! -s "$prev_file" ]; then
              prev_file=".base-ci-releases/previous.json"
            fi
            if [ ! -s "$prev_file" ]; then
              echo "::warning::No previous Docker release manifest found for auto-rollback"
              exit 0
            fi
            workdir="$(mktemp -d .base-ci-rollback.XXXXXX)"
            trap 'rm -rf "$workdir"' EXIT
            docker compose config --format json > "$workdir/current.json"
            PREV_MANIFEST_PATH="$prev_file" python3 - "$workdir" <<'PY'
            import json, os, pathlib, sys
            root = pathlib.Path(sys.argv[1])
            config = json.loads((root / 'current.json').read_text())
            images = json.loads(pathlib.Path(os.environ['PREV_MANIFEST_PATH']).read_text())
            for entry in images:
                service = entry['service']
                if service not in config['services']:
                    raise SystemExit(f'Unknown Compose service: {service}')
                config['services'][service]['image'] = entry['image'] + '@' + entry['digest']
            (root / 'release.json').write_text(json.dumps(config))
            (root / 'services').write_text('\n'.join(x['service'] for x in images) + '\n')
            PY
            services=()
            while IFS= read -r service; do
              services+=("$service")
            done < "$workdir/services"
            docker compose --project-directory "$PWD" -f "$workdir/release.json" up -d --no-deps "${services[@]}"
            cp "$prev_file" .base-ci-releases/current.json
            bash -euo pipefail -c "$REMOTE_VERIFY_COMMAND" || true
      - name: Record release evidence
        if: always() && (steps.manifest.outputs.release-images != '' || inputs.rollback-sha != '')
        env:
          RELEASE_IMAGES: ${{ steps.manifest.outputs.release-images }}
          ROLLBACK_SHA: ${{ inputs.rollback-sha }}
          D5_OUTCOME: ${{ steps.d5-verify.outcome }}
        run: |
          {
            if [ -n "$ROLLBACK_SHA" ]; then
              echo "Rolled back Docker services to \`$ROLLBACK_SHA\` (D5 outcome: \`$D5_OUTCOME\`)."
            else
              echo "Released verified Docker image manifest (D5 outcome: \`$D5_OUTCOME\`):"
              printf '```json\n%s\n```\n' "$RELEASE_IMAGES"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
