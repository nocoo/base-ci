name: Self Test Quality

on:
  push:
    branches: [main, feat/shared-quality-20260912]
  pull_request:
    branches: [main]

jobs:
  test-native-node:
    uses: ./.github/workflows/test-job.yml
    with:
      runtime: none
      node-version: '26.12.1'
      command: node -e "require('node:assert/strict').equal(process.versions.node, '26.12.1')"

  # ─────────────────────────────────────────────────────
  # 1. Native runner test (Python / macOS & Linux matrix support)
  # ─────────────────────────────────────────────────────
  test-native-python:
    name: Native Python / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    uses: ./.github/workflows/test-job.yml
    with:
      runner: ${{ matrix.runner }}
      runtime: none
      python-version: "3.11"
      pre-command: 'echo "PRE_FLAG=1" >> "$GITHUB_ENV"'
      command: |
        python3 -c "
        import os, sys
        assert os.environ.get('CI') == 'true', 'CI must be true'
        assert os.environ.get('TEST_MODE') == 'offline', 'TEST_MODE mismatch'
        assert os.environ.get('PRE_FLAG') == '1', 'PRE_FLAG from pre-command missing'
        multi = os.environ.get('TEST_MULTILINE', '')
        assert 'line1' in multi and 'line2' in multi, 'Multiline env missing'
        print('Native python verified CI=true, pre-command env, and multiline env')
        "
      env-json: '{"TEST_MODE": "offline", "APP_ENV": "local", "TEST_MULTILINE": "line1\nline2\nline3"}'

  test-package-managers:
    name: ${{ matrix.runtime }} ${{ matrix.version }} / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: npm
            version: '11.19.1'
            directory: .github/fixtures/npm-basic
            runner: ubuntu-latest
          - runtime: pnpm
            version: '10.34.5'
            directory: .github/fixtures/pnpm-basic
            runner: ubuntu-latest
          - runtime: bun
            version: '1.2.15'
            directory: .github/fixtures/quality-basic
            runner: ubuntu-latest
          - runtime: bun
            version: '1.4.2'
            directory: .github/fixtures/quality-basic
            runner: macos-latest
    uses: ./.github/workflows/test-job.yml
    with:
      runner: ${{ matrix.runner }}
      runtime: ${{ matrix.runtime }}
      runtime-version: ${{ matrix.version }}
      working-directory: ${{ matrix.directory }}
      command: node -e "require('node:assert/strict').equal(require('fixture-module')(' value '), 'value')"

  # ─────────────────────────────────────────────────────
  # 2. Quality workflow invocation on fixture (legacy slot path:
  #    no slot-status input, statuses derived from the boolean inputs)
  # ─────────────────────────────────────────────────────
  test-quality-basic:
    name: "Quality Gate (legacy slot path, bun on quality-basic fixture)"
    uses: ./.github/workflows/quality.yml
    with:
      package-manager: bun
      working-directory: .github/fixtures/quality-basic
      install-policy: project
      typecheck: true
      lint: true
      unit: true
      security: false
      disabled-check-reasons: '{"security": "skip in local fixture test"}'
      typecheck-command: "echo 'typecheck' && [ \"$CI\" = 'true' ] && [ -n \"$TEST_MULTILINE\" ]"
      lint-command: "echo 'lint' | tr 'a-z' 'A-Z' > /dev/null"
      test-command: "mkdir -p coverage && echo 'TN:\nend_of_record' > coverage/lcov.info && [ -n \"$TEST_MULTILINE\" ] && echo 'coverage ok'"
      coverage-path: ".github/fixtures/quality-basic/coverage"
      build: true
      build-command: "cd sub && test -s input.txt && [ \"$CI\" = 'true' ] && cd .."
      l2: true
      l2-command: "test -f package.json && [ \"$CI\" = 'true' ] && [ -n \"$TEST_MULTILINE\" ]"
      worker: true
      worker-directory: ".github/fixtures/quality-basic/worker"
      worker-command: "test -f package.json && echo 'worker test' && true"
      package-check: true
      package-command: "echo \"package check: ok\""
      env-json: '{"TEST_MULTILINE": "line1\nline2"}'

  # ─────────────────────────────────────────────────────
  # 2b. Quality workflow invocation with an explicit slot-status
  #     declaration (strict slot path: every v1 slot is declared).
  #     It waits for the legacy path because both calls share the
  #     quality.yml concurrency group and cancel each other otherwise.
  # ─────────────────────────────────────────────────────
  test-quality-strict-slots:
    name: "Quality Gate (strict slot path, security-basic fixture)"
    needs: test-quality-basic
    uses: ./.github/workflows/quality.yml
    with:
      package-manager: bun
      working-directory: .github/fixtures/security-basic
      install-policy: project
      typecheck: false
      lint: true
      unit: true
      security: true
      disabled-check-reasons: '{"typecheck": "plain JavaScript fixture without a type system"}'
      lint-command: >-
        node -e "require('node:assert/strict').equal(require('./package.json').dependencies['is-number'],'7.0.0')"
      test-command: >-
        node -e "require('node:assert/strict').equal(require('is-number')('42'),true)" && mkdir -p coverage && echo 'TN:' > coverage/lcov.info && echo 'end_of_record' >> coverage/lcov.info
      coverage-path: .github/fixtures/security-basic/coverage
      coverage-artifact-name: coverage-report-strict-slots
      workflow-lint: true
      workflow-lint-files: .github/workflows/quality.yml
      slot-status: >-
        {"S1": {"status": "na", "reason": "fixture is plain JavaScript without a type system"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "todo", "reason": "fixture has no build output"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "fixture has no Worker runtime"},
        "L2": {"status": "na", "reason": "fixture exposes no HTTP API"},
        "L3": {"status": "na", "reason": "fixture has no browser UI"},
        "P1": {"status": "todo", "reason": "fixture is not published as a package"},
        "Z1": {"status": "impl"}}

  # ─────────────────────────────────────────────────────
  # 3. Security workflow invocation
  # ─────────────────────────────────────────────────────
  test-security-scan:
    name: "G1 + G2: Security Scan on basic fixture"
    uses: ./.github/workflows/security.yml
    with:
      working-directory: .github/fixtures/security-basic
      lockfiles: "bun.lock,package-lock.json"
      scan-secrets: true
      scan-dependencies: true
      security-command: "echo 'custom security command ok' && true"

  # ─────────────────────────────────────────────────────
  # 4. Verify outputs of both slot paths
  # ─────────────────────────────────────────────────────
  verify-quality-output:
    name: "Verify Quality Gate Output"
    needs: [test-quality-basic, test-quality-strict-slots, test-native-python]
    runs-on: ubuntu-latest
    steps:
      - name: Check legacy slot path tested-sha
        run: |
          SHA="${{ needs.test-quality-basic.outputs.tested-sha }}"
          echo "Verified tested-sha for the legacy slot path: $SHA"
          if [ "$SHA" != "${{ github.sha }}" ]; then
            echo "::error::tested-sha of the legacy slot path must match the workflow commit!"
            exit 1
          fi
      - name: Check strict slot path tested-sha
        run: |
          SHA="${{ needs.test-quality-strict-slots.outputs.tested-sha }}"
          echo "Verified tested-sha for the strict slot path: $SHA"
          if [ "$SHA" != "${{ github.sha }}" ]; then
            echo "::error::tested-sha of the strict slot path must match the workflow commit!"
            exit 1
          fi
