name: Deploy Docker

on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: production
      expected-workflow-path:
        type: string
        default: .github/workflows/ci.yml
      expected-workflow-name:
        type: string
        default: CI
      expected-branch:
        type: string
        default: main
      tag:
        type: string
        default: ''
      source-run-id:
        type: string
        default: ''
      images:
        description: JSON array of image, service, context, file and build-args objects
        type: string
        required: true
      deploy-directory:
        type: string
        required: true
      remote-verify-command:
        description: Project health checks executed in the server deployment directory
        type: string
        required: true
      verify-command:
        description: Project checks executed on the runner after deployment
        type: string
        required: true
      timeout-minutes:
        type: number
        default: 25
    secrets:
      VPS_HOST:
        required: false
      VPS_USER:
        required: false
      VPS_SSH_KEY:
        required: false
      VPS_PORT:
        required: false
      VPS_KNOWN_HOSTS:
        required: false
      GHCR_PULL_USER:
        required: false
      GHCR_PULL_TOKEN:
        required: false
      BUILD_ARGS:
        description: Additional Docker build arguments supplied by the caller
        required: false
    outputs:
      target-sha:
        value: ${{ jobs.source.outputs.sha }}
      source-run-id:
        value: ${{ jobs.source.outputs.run-id }}
      release-images:
        value: ${{ jobs.deploy.outputs.release-images }}

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: base-ci-docker-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.target-sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
      run-id: ${{ steps.source.outputs.source-run-id }}
    steps:
      - id: source
        uses: nocoo/base-ci/.github/actions/release-source@8cbdb970c3a38240289c1e152c40dd550ac62dba
        with:
          expected-workflow-path: ${{ inputs.expected-workflow-path }}
          expected-workflow-name: ${{ inputs.expected-workflow-name }}
          expected-branch: ${{ inputs.expected-branch }}
          tag: ${{ inputs.tag }}
          source-run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}
      - id: plan
        uses: nocoo/base-ci/.github/actions/docker-manifest@10029d24ee49eb8c27f2807ee9b777570a7447de
        with:
          images: ${{ inputs.images }}
          source-sha: ${{ steps.source.outputs.target-sha }}

  build:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: true
          build-args: |
            ${{ matrix.image.build-args }}
            ${{ secrets.BUILD_ARGS }}
          tags: |
            ${{ matrix.image.image }}:${{ needs.source.outputs.sha }}
            ${{ matrix.image.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.service }}
      - name: Record built image digest
        env:
          RELEASE_IMAGE: ${{ matrix.image.image }}
          RELEASE_SERVICE: ${{ matrix.image.service }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, writeFileSync } from 'node:fs';
          const { RELEASE_IMAGE: image, RELEASE_SERVICE: service, RELEASE_DIGEST: digest, RELEASE_SOURCE_SHA: sourceSha } = process.env;
          mkdirSync('base-ci-digests', { recursive: true });
          writeFileSync(`base-ci-digests/${service}.json`, JSON.stringify({ image, service, digest, sourceSha }));
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: base-ci-image-${{ matrix.image.service }}-${{ needs.source.outputs.sha }}
          path: base-ci-digests/*.json
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: [source, build]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment }}
    outputs:
      release-images: ${{ steps.manifest.outputs.release-images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Validate deployment credentials
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY GHCR_PULL_USER GHCR_PULL_TOKEN; do
            test -n "${!name}" || { echo "::error::Missing deployment credential: $name"; exit 1; }
          done
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: base-ci-image-*-${{ needs.source.outputs.sha }}
          path: base-ci-digests
          merge-multiple: true
      - id: manifest
        uses: nocoo/base-ci/.github/actions/docker-manifest@10029d24ee49eb8c27f2807ee9b777570a7447de
        with:
          images: ${{ inputs.images }}
          source-sha: ${{ needs.source.outputs.sha }}
          directory: base-ci-digests
      - name: Wait for SSH reachability
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if nc -z -w 5 "$VPS_HOST" "$VPS_PORT" 2>/dev/null; then exit 0; fi
            if [ "$attempt" != 6 ]; then sleep 5; fi
          done
          echo '::error::SSH host is unreachable'
          exit 1
      - name: Recheck proven source before deployment
        uses: nocoo/base-ci/.github/actions/release-source@8cbdb970c3a38240289c1e152c40dd550ac62dba
        with:
          expected-workflow-path: ${{ inputs.expected-workflow-path }}
          expected-workflow-name: ${{ inputs.expected-workflow-name }}
          expected-branch: ${{ inputs.expected-branch }}
          tag: ${{ inputs.tag }}
          source-run-id: ${{ needs.source.outputs.run-id }}
          source-sha: ${{ needs.source.outputs.sha }}
          github-token: ${{ github.token }}
      - name: Deploy verified images
        uses: nocoo/base-ci/.github/actions/ssh-deploy@e07457ae8bf223fafef8a1c2e89659e3f692e3cc
        env:
          IMAGE_SHA: ${{ needs.source.outputs.sha }}
          RELEASE_IMAGES: ${{ steps.manifest.outputs.release-images }}
          DEPLOY_DIRECTORY: ${{ inputs.deploy-directory }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          REMOTE_VERIFY_COMMAND: ${{ inputs.remote-verify-command }}
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          envs: IMAGE_SHA RELEASE_IMAGES DEPLOY_DIRECTORY GHCR_PULL_USER GHCR_PULL_TOKEN REMOTE_VERIFY_COMMAND
          script: |
            set -euo pipefail
            umask 077
            cd -- "$DEPLOY_DIRECTORY"
            command -v python3 >/dev/null
            printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_PULL_USER" --password-stdin
            workdir="$(mktemp -d .base-ci-deploy.XXXXXX)"
            trap 'rm -rf "$workdir"' EXIT
            docker compose config --format json > "$workdir/current.json"
            python3 - "$workdir" <<'PY'
            import json, os, pathlib, sys
            root = pathlib.Path(sys.argv[1])
            config = json.loads((root / 'current.json').read_text())
            images = json.loads(os.environ['RELEASE_IMAGES'])
            for entry in images:
                service = entry['service']
                if service not in config['services']:
                    raise SystemExit(f'Unknown Compose service: {service}')
                config['services'][service]['image'] = entry['image'] + '@' + entry['digest']
            (root / 'release.json').write_text(json.dumps(config))
            (root / 'services').write_text('\n'.join(x['service'] for x in images) + '\n')
            PY
            services=()
            while IFS= read -r service; do
              services+=("$service")
              docker compose --project-directory "$PWD" -f "$workdir/release.json" pull "$service"
            done < "$workdir/services"
            docker compose --project-directory "$PWD" -f "$workdir/release.json" up -d --no-deps "${services[@]}"
            bash -euo pipefail -c "$REMOTE_VERIFY_COMMAND"
            mkdir -p .base-ci-releases
            printf '%s\n' "$RELEASE_IMAGES" > ".base-ci-releases/$IMAGE_SHA.json"
      - name: Verify deployed service
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          RELEASE_IMAGES: ${{ steps.manifest.outputs.release-images }}
          VERIFY_COMMAND: ${{ inputs.verify-command }}
        run: bash -euo pipefail -c "$VERIFY_COMMAND"
      - name: Record release evidence
        env:
          RELEASE_IMAGES: ${{ steps.manifest.outputs.release-images }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          printf 'Deployed source: `%s`\n\n```json\n%s\n```\n' "$SOURCE_SHA" "$RELEASE_IMAGES" >> "$GITHUB_STEP_SUMMARY"
