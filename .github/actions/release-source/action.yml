name: Release source
description: Fail-closed GitHub API proof of a commit SHA and CI run for any deploy platform

inputs:
  github-token:
    description: Token with actions:read used to GET the selected CI run
    required: true
  workflow-path:
    description: Canonical CI workflow path (example .github/workflows/ci.yml)
    required: true
  workflow-name:
    description: Canonical CI workflow name (example CI or Tests)
    required: true
  branch:
    description: Default branch used for main CI and freshness (not compared to a tag CI head_branch)
    required: false
    default: main
  source-ref:
    description: Full commit SHA, tag name, or refs/tags/... that must match the proven run SHA
    required: true
  ci-run-id:
    description: Explicit Actions run ID to GET and verify (workflow_run, manual, or tag CI)
    required: true
  allowed-source-events:
    description: Comma or newline separated events allowed on the proven CI run (default push)
    required: false
    default: push
  require-fresh-main:
    description: "true to require a default-branch CI SHA to equal the current branch tip (skipped for tag CI)"
    required: false
    default: "true"
  package-version-match:
    description: "true to require a vX.Y.Z source-ref to match package.json version at the proven SHA"
    required: false
    default: "false"
  package-json-path:
    description: Repository-relative package.json path used when package-version-match is true
    required: false
    default: package.json

outputs:
  sha:
    description: Proven 40-character commit SHA
    value: ${{ steps.resolve.outputs.sha }}
  run-id:
    description: Proven Actions run ID
    value: ${{ steps.resolve.outputs.run-id }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RELEASE_WORKFLOW_PATH: ${{ inputs.workflow-path }}
        RELEASE_WORKFLOW_NAME: ${{ inputs.workflow-name }}
        RELEASE_BRANCH: ${{ inputs.branch }}
        RELEASE_SOURCE_REF: ${{ inputs.source-ref }}
        RELEASE_CI_RUN_ID: ${{ inputs.ci-run-id }}
        RELEASE_ALLOWED_SOURCE_EVENTS: ${{ inputs.allowed-source-events }}
        RELEASE_REQUIRE_FRESH_MAIN: ${{ inputs.require-fresh-main }}
        RELEASE_PACKAGE_VERSION_MATCH: ${{ inputs.package-version-match }}
        RELEASE_PACKAGE_JSON_PATH: ${{ inputs.package-json-path }}
      run: node "$GITHUB_ACTION_PATH/resolve.mjs"
