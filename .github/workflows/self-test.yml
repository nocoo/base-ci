name: Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint all workflows
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Test release manifests
        run: node --test .github/actions/docker-manifest/index.test.mjs
      - name: Test runtime and environment helpers
        run: |
          python3 -m unittest discover -s .github/actions/setup-js -p 'test_*.py'
          python3 -m unittest discover -s .github/actions/configure-env -p 'test_*.py'
      - name: Validate YAML
        run: |
          python3 -c "
          import yaml, sys
          with open('.github/workflows/bun-quality.yml') as f:
              try:
                  yaml.safe_load(f)
                  print('✅ bun-quality.yml is valid YAML')
              except yaml.YAMLError as e:
                  print(f'❌ Invalid YAML: {e}')
                  sys.exit(1)
          "
      - name: Check workflow structure
        run: |
          python3 -c "
          import yaml, sys
          with open('.github/workflows/bun-quality.yml') as f:
              wf = yaml.safe_load(f)
          # PyYAML parses YAML 'on:' key as Python boolean True
          assert True in wf or 'on' in wf, 'Missing on: trigger'
          on_key = wf.get(True) or wf.get('on')
          assert 'workflow_call' in on_key, 'Missing workflow_call trigger'
          assert 'workflow_dispatch' in on_key, 'Missing workflow_dispatch trigger (needed to refresh stale latest run — see refresh-latest job)'
          assert 'jobs' in wf, 'Missing jobs'
          inputs = on_key['workflow_call'].get('inputs', {})
          for required in ('ignore-scripts', 'extra-install-dirs'):
              assert required in inputs, f'Missing input: {required}'
          assert inputs['ignore-scripts']['type'] == 'boolean'
          assert inputs['ignore-scripts']['default'] is False
          assert inputs['extra-install-dirs']['type'] == 'string'
          assert inputs['extra-install-dirs']['default'] == ''
          # Self-dispatch sentinel — must exist on BOTH triggers with matching semantics.
          # workflow_call default MUST be False so real callers never accidentally skip
          # the reusable jobs; workflow_dispatch default MUST be True so a manual
          # UI-triggered latest-refresh run activates the sentinel path automatically.
          for trigger_name in ('workflow_call', 'workflow_dispatch'):
              trig_inputs = on_key[trigger_name].get('inputs', {})
              assert '_self_dispatch' in trig_inputs, f'Missing _self_dispatch on {trigger_name}'
              assert trig_inputs['_self_dispatch']['type'] == 'boolean', f'_self_dispatch on {trigger_name} must be boolean'
          assert on_key['workflow_call']['inputs']['_self_dispatch']['default'] is False, \
              'workflow_call._self_dispatch default must be False (else real callers skip every job)'
          assert on_key['workflow_dispatch']['inputs']['_self_dispatch']['default'] is True, \
              'workflow_dispatch._self_dispatch default must be True (else manual refresh runs the reusable jobs and fails)'
          jobs = wf['jobs']
          assert 'refresh-latest' in jobs, 'Missing refresh-latest job (used to overwrite stale failure at latest)'
          # refresh-latest's if: MUST reference _self_dispatch AND MUST NOT negate
          # it. We compare against the substring of the if: expression rather than
          # a full literal, because writing the GHA expression syntax inside this
          # heredoc would confuse both actionlint and the shell heredoc quoting.
          refresh_if = jobs['refresh-latest'].get('if', '')
          assert '_self_dispatch' in refresh_if, 'refresh-latest must gate on _self_dispatch'
          assert '!inputs._self_dispatch' not in refresh_if.replace(' ', ''), 'refresh-latest must run WHEN self-dispatch is true, not when false'
          # Every non-sentinel job must be gated OFF when _self_dispatch is true.
          for name, job in jobs.items():
              if name == 'refresh-latest':
                  continue
              cond = job.get('if', '').replace(' ', '')
              assert '!inputs._self_dispatch' in cond, f'job {name!r} is missing self-dispatch skip gate — a manual refresh will try to run it and fail'
          print('✅ Workflow structure valid')
          print(f'  Triggers: {list(on_key.keys())}')
          print(f'  Jobs: {list(wf[\"jobs\"].keys())}')
          print(f'  Inputs: {len(inputs)}')
          "

  # Behavior coverage for the v2026.2 hardening inputs.
  #
  # The fixture under .github/fixtures/self-test/ pulls a local
  # `self-test-native-marker` package (whitelisted via trustedDependencies)
  # whose postinstall writes a sentinel file at $NATIVE_MARKER_FILE.
  # Running `bun install --ignore-scripts` against the fixture must NOT
  # create that file; the same recipe without the flag MUST create it.
  # That gives us a direct proof that the recipe used by bun-quality.yml
  # actually suppresses lifecycle scripts.
  hardening:
    name: "Hardening: ignore-scripts + extra-install-dirs"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .github/fixtures/self-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Export marker paths
        run: |
          echo "MARKER_FILE=$RUNNER_TEMP/self-test-marker" >> "$GITHUB_ENV"
          echo "NATIVE_MARKER_FILE=$RUNNER_TEMP/self-test-native-marker" >> "$GITHUB_ENV"

      - name: Reset markers
        run: rm -f "$MARKER_FILE" "$NATIVE_MARKER_FILE"

      - name: Negative control — install without --ignore-scripts
        run: bun install --frozen-lockfile

      - name: Assert whitelisted postinstall ran in the negative control
        shell: bash
        run: |
          if [ ! -f "$NATIVE_MARKER_FILE" ]; then
            echo "❌ negative control failed: whitelisted marker missing, fixture is broken"
            exit 1
          fi
          echo "✅ negative control: postinstall ran for whitelisted dep as expected"

      - name: Reset fixture for the hardened run
        shell: bash
        run: |
          rm -rf node_modules worker/node_modules
          rm -f "$MARKER_FILE" "$NATIVE_MARKER_FILE"

      - name: Install fixture with --ignore-scripts (mirrors bun-quality.yml)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install extra dirs (mirrors bun-quality.yml extra-install-dirs loop)
        shell: bash
        run: |
          IFS=',' read -ra DIRS <<< "worker"
          for d in "${DIRS[@]}"; do
            d_trim="$(echo "$d" | xargs)"
            echo "::group::bun install in $d_trim"
            (cd "$d_trim" && bun install --frozen-lockfile --ignore-scripts)
            echo "::endgroup::"
          done

      - name: Assert --ignore-scripts skipped both installs
        shell: bash
        run: |
          if [ -f "$MARKER_FILE" ] || [ -f "$NATIVE_MARKER_FILE" ]; then
            echo "❌ a marker exists — postinstall ran despite --ignore-scripts"
            ls -la "$MARKER_FILE" "$NATIVE_MARKER_FILE" 2>&1 || true
            exit 1
          fi
          echo "✅ --ignore-scripts suppressed lifecycle scripts in main + worker"

  # Behavior coverage for the v2026.4 trusted-native-deps model.
  #
  # When the caller workflow sets `trusted-native-deps: "..."`, bun-quality.yml
  # does NOT forward --ignore-scripts. Instead bun uses its own
  # `package.json#trustedDependencies` whitelist to gate which postinstall
  # scripts run. This job exercises that recipe:
  #
  #   - self-test-native-marker  (IN trustedDependencies — must run)
  #   - self-test-marker         (NOT in trustedDependencies — must stay blocked)
  #
  # That is a direct positive+negative proof for the v2026.4 behavior:
  # native bindings load, every other postinstall stays gated.
  trusted-native-deps:
    name: "Hardening: trustedDependencies whitelist runs only listed postinstall"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .github/fixtures/self-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Export marker paths
        run: |
          echo "MARKER_FILE=$RUNNER_TEMP/self-test-marker" >> "$GITHUB_ENV"
          echo "NATIVE_MARKER_FILE=$RUNNER_TEMP/self-test-native-marker" >> "$GITHUB_ENV"

      - name: Reset fixture and markers
        shell: bash
        run: |
          rm -rf node_modules worker/node_modules
          rm -f "$MARKER_FILE" "$NATIVE_MARKER_FILE"

      - name: Install fixture (no --ignore-scripts, mirrors v2026.4 bun-quality.yml when trusted-native-deps is set)
        run: bun install --frozen-lockfile

      - name: Assert ONLY the whitelisted postinstall ran
        shell: bash
        run: |
          if [ ! -f "$NATIVE_MARKER_FILE" ]; then
            echo "❌ native marker missing — trustedDependencies whitelist did NOT run self-test-native-marker's postinstall"
            exit 1
          fi
          if [ -f "$MARKER_FILE" ]; then
            echo "❌ non-whitelisted marker exists — bun ran self-test-marker's postinstall despite it being absent from trustedDependencies (Shai-Hulud defense broken)"
            exit 1
          fi
          echo "✅ trustedDependencies whitelist ran ONLY self-test-native-marker; self-test-marker stayed blocked"

      - name: Sanity check — require('self-test-native-marker') loads (mirrors native binding)
        shell: bash
        run: |
          # The package's index.js throws if its postinstall flag is missing
          # — the same failure mode `require('better-sqlite3')` would exhibit
          # when its prebuilt binding never got fetched. Asserts the v2026.4
          # path produces a *working* dep, not just a marker file.
          node -e "const m = require('self-test-native-marker'); if (!m.loaded) { console.error('loaded flag missing'); process.exit(1); }"
          echo "✅ require('self-test-native-marker') succeeds (binding usable)"

  # Behavior coverage for the v2026.6 worker-tests + extra-install-dirs
  # collision fix.
  #
  # The bug (issue #5): the worker-tests job sets
  #   defaults.run.working-directory: ${{ inputs.worker-directory }}
  # so the shared "Install extra dirs" step runs inside worker/, and
  # `cd worker` inside worker/ resolves to worker/worker → No such
  # file or directory → job fails. Callers that need to list their
  # worker in extra-install-dirs (so L2/L3 also get worker deps) can
  # therefore never enable enable-worker.
  #
  # Fix: the worker-tests-only "Install extra dirs" step now
  #   1. overrides working-directory to $GITHUB_WORKSPACE, and
  #   2. skips the entry that equals worker-directory (already
  #      installed by the preceding step).
  #
  # This job mirrors both the failing shape and the fixed recipe
  # against the same fixture. Negative control uses the OLD recipe
  # and MUST fail with the historical error; positive control uses
  # the NEW recipe and MUST succeed and skip the duplicate.
  worker-tests-extra-install-collision:
    name: "Regression: worker-tests + extra-install-dirs=worker"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Mirror worker-tests job — every step below defaults into worker/.
    defaults:
      run:
        working-directory: .github/fixtures/self-test/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      # Preflight: prove the working-directory is really the worker
      # sub-fixture, so a green result later cannot be a false pass.
      - name: Preflight — confirm we are inside the worker fixture
        shell: bash
        run: |
          test -f package.json
          grep -q base-ci-self-test-fixture-worker package.json

      # ── Negative control (pre-fix behaviour) ──────────────────
      # The pre-v2026.6 recipe: no working-directory override, no skip.
      # `cd worker` runs from inside worker/ → worker/worker missing.
      # Must fail; captured with `continue-on-error` so the job survives
      # to run the positive path.
      - name: "Negative control — OLD recipe must fail"
        id: old_recipe
        continue-on-error: true
        shell: bash
        run: |
          IFS=',' read -ra DIRS <<< "worker"
          for d in "${DIRS[@]}"; do
            d_trim="$(echo "$d" | xargs)"
            echo "::group::[old] bun install in $d_trim"
            (cd "$d_trim" && bun install --frozen-lockfile)
            echo "::endgroup::"
          done

      - name: Assert OLD recipe failed (regression fixture is faithful)
        shell: bash
        run: |
          if [ "${{ steps.old_recipe.outcome }}" != "failure" ]; then
            echo "❌ regression fixture stopped reproducing #5 — the OLD recipe now passes, so this test is no longer proving anything."
            exit 1
          fi
          echo "✅ OLD recipe failed as expected — regression is faithful"

      # ── Positive control (post-fix behaviour) ─────────────────
      # The v2026.6 recipe, transcribed verbatim from bun-quality.yml
      # worker-tests job. `working-directory` escapes back to
      # $GITHUB_WORKSPACE; the loop skips the entry that equals
      # worker-directory.
      - name: "Positive control — NEW recipe must succeed"
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          IFS=',' read -ra DIRS <<< "worker,.github/fixtures/self-test/worker"
          worker_dir=".github/fixtures/self-test/worker"
          for d in "${DIRS[@]}"; do
            d_trim="$(echo "$d" | xargs)"
            if [ "$d_trim" = "$worker_dir" ]; then
              echo "::group::skip $d_trim (already installed as worker-directory)"
              echo "::endgroup::"
              continue
            fi
            # The "worker" entry (relative to repo root) does not exist
            # in this repo; treat missing dirs as skipped too so this
            # step actually proves the skip logic rather than crashing
            # on a shape that would never appear in a real caller.
            if [ ! -d "$d_trim" ]; then
              echo "::group::skip $d_trim (fixture-only sentinel, not present)"
              echo "::endgroup::"
              continue
            fi
            echo "::group::[new] bun install in $d_trim"
            (cd "$d_trim" && bun install --frozen-lockfile)
            echo "::endgroup::"
          done
          echo "✅ NEW recipe: worker-directory entry skipped, no cd-into-worker/worker attempt"
