# Reusable quality workflow for JavaScript/TypeScript projects (Bun, npm, pnpm).
# Implements the System0 quality slots (see nocoo/workflow system0-quality skill; local wiring in docs/slots.md):
#   S1 Types, S2 Lint, S3 Workflow, G1 Secrets, G2 Dependencies, B1 Build, L1 Unit,
#   L2 Runtime, L3 Integration, L4 E2E, P1 Package, Z1 Gate.
#
# Every slot is a top-level job, so each slot renders exactly one GitHub check named
# "<ID>: <Canonical Name>" (e.g. "G1: Secret Scan"). quality.yml never calls another
# reusable workflow; security.yml / workflow-lint.yml / test-job.yml stay intact for
# direct callers and keep their own job names.
#
# Emits tested-sha and artifact outputs only when all enabled checks succeed and tested-sha matches.

name: Quality Gate

on:
  workflow_call:
    inputs:
      # Ecosystem & Runtimes
      package-manager:
        description: "Package manager: bun, npm, or pnpm"
        type: string
        default: "bun"
      runtime-version:
        description: "Exact Bun, npm, or pnpm version (empty = resolved by setup-js)"
        type: string
        default: ""
      node-version:
        description: "Node.js version (empty = resolved from file or default 26.12.1)"
        type: string
        default: ""
      working-directory:
        description: "Working directory relative to repo root"
        type: string
        default: "."

      # Hardening & Directories
      install-policy:
        description: "Lifecycle script policy: blocked, trusted, or project"
        type: string
        default: "blocked"
      extra-install-dirs:
        description: "Newline or comma-separated extra directories needing install"
        type: string
        default: ""

      # Core checks boolean switches
      typecheck:
        description: "Run typecheck"
        type: boolean
        default: true
      lint:
        description: "Run lint"
        type: boolean
        default: true
      unit:
        description: "Run unit tests"
        type: boolean
        default: true
      security:
        description: "Run security scanner (secrets + osv)"
        type: boolean
        default: true

      # Disabled reasons (JSON object: {"typecheck": "plain JS without tsconfig"})
      disabled-check-reasons:
        description: "Explanations for intentionally disabled core checks"
        type: string
        default: "{}"

      # Core command overrides
      typecheck-command:
        description: "Typecheck command (defaults to bun run typecheck / npm run typecheck / pnpm run typecheck)"
        type: string
        default: ""
      lint-command:
        description: "Lint command (defaults to bun run lint / npm run lint / pnpm run lint)"
        type: string
        default: ""
      test-command:
        description: "Unit test command (defaults to bun run test:coverage / npm run test:coverage / pnpm run test:coverage)"
        type: string
        default: ""
      prepare-command:
        description: "Optional setup command before static/test steps"
        type: string
        default: ""

      # Extended checks boolean switches
      build:
        description: "Run build step"
        type: boolean
        default: false
      build-command:
        description: "Build command"
        type: string
        default: ""

      l2:
        description: "Deprecated alias for L3 Integration (inputs.l3-integration); enables the L3 Integration job"
        type: boolean
        default: false
      l3-integration:
        description: "Run L3 Integration tests (HTTP, MCP, protocol, storage); preferred over l2"
        type: boolean
        default: false
      l2-command:
        description: "L2 test command"
        type: string
        default: ""
      l2-artifact-name:
        description: "Name of the L2 evidence artifact (empty = no upload)"
        type: string
        default: ""
      l2-artifact-path:
        description: "Path of the L2 evidence to upload (empty = no upload)"
        type: string
        default: ""

      l3:
        description: "Deprecated alias for L4 E2E; enables the L4 E2E job"
        type: boolean
        default: false
      l4:
        description: "Run L4 E2E (CLI, native, workflow, or browser journeys)"
        type: boolean
        default: false
      l4-command:
        description: "L4 E2E command (preferred over l3-command)"
        type: string
        default: ""
      l4-browsers:
        description: "Space-separated Playwright browsers to install for L4 (optional; preferred over l3-browsers)"
        type: string
        default: ""
      l4-browser-directory:
        description: "Playwright browser installation directory for L4"
        type: string
        default: ""
      l4-prepare-command:
        description: "Optional setup command for L4 (used when set, otherwise l3-prepare-command or prepare-command)"
        type: string
        default: ""
      l4-artifact-name:
        description: "Name of the L4 evidence artifact (empty = no upload)"
        type: string
        default: ""
      l4-artifact-path:
        description: "Path of the L4 evidence to upload (multiline allowed, empty = no upload)"
        type: string
        default: ""
      l3-command:
        description: "L3 test command"
        type: string
        default: ""
      l3-browsers:
        description: "Deprecated; space-separated Playwright browsers for L4 (preferred: l4-browsers)"
        type: string
        default: ""
      l3-prepare-command:
        description: "Optional setup command for L3 (used when set, otherwise prepare-command)"
        type: string
        default: ""
      l3-artifact-name:
        description: "Name of the L3 evidence artifact (empty = no upload)"
        type: string
        default: ""
      l3-artifact-path:
        description: "Path of the L3 evidence to upload (multiline allowed, empty = no upload)"
        type: string
        default: ""

      worker:
        description: "Deprecated alias for L2 Runtime; enables the L2 Runtime job"
        type: boolean
        default: false
      l2-runtime:
        description: "Run L2 Runtime tests (workerd, vitest-pool-workers, miniflare); preferred over worker"
        type: boolean
        default: false
      worker-command:
        description: "Worker test command"
        type: string
        default: ""
      worker-directory:
        description: "Worker directory"
        type: string
        default: "worker"
      worker-prepare-command:
        description: "Optional setup command in worker directory (defaults to empty, preserving legacy bun-quality behavior)"
        type: string
        default: ""

      package-check:
        description: "Run package validation checks (publint, attw, etc.)"
        type: boolean
        default: false
      package-command:
        description: "Package check command"
        type: string
        default: ""

      # System0 slot declarations (docs/slots.md implementation notes)
      slot-status:
        description: "Slot status declaration JSON, e.g. {\"L4\": {\"status\":\"na\",\"reason\":\"no user journeys\"}}. Empty = legacy mode derived from the boolean inputs"
        type: string
        default: ""
      workflow-lint:
        description: "Run the S3 workflow lint slot"
        type: boolean
        default: false
      workflow-lint-files:
        description: "Space-separated workflow paths checked by S3 (empty = every workflow)"
        type: string
        default: ""
      workflow-lint-required-workflow:
        description: "Reusable workflow that must appear in the files checked by S3"
        type: string
        default: ""
      workflow-lint-yamllint:
        description: "Run yamllint style checks in S3"
        type: boolean
        default: false

      # Security details
      lockfiles:
        description: "Newline or comma-separated lockfiles for OSV scan"
        type: string
        default: ""
      osv-config:
        description: "Path to .osv-scanner.toml (optional)"
        type: string
        default: ""
      gitleaks-config:
        description: "Path to .gitleaks.toml (optional)"
        type: string
        default: ""
      gitleaks-ignore-path:
        description: "Path to .gitleaksignore file (optional)"
        type: string
        default: ""
      security-command:
        description: "Custom security check command (e.g. 'bun run gate:security')"
        type: string
        default: ""

      # Coverage and Artifacts
      coverage-path:
        description: "Path to coverage output directory (empty = skip upload)"
        type: string
        default: ""
      artifact-name:
        description: "Name for build/test artifact"
        type: string
        default: ""
      artifact-paths:
        description: "Artifact paths to upload (empty = skip upload)"
        type: string
        default: ""

      # Environment configuration
      env-json:
        description: "Explicit non-sensitive environment variables as JSON object string"
        type: string
        default: "{}"

    secrets:
      test-env-json:
        description: "Optional explicit JSON string of test credentials, forwarded only to test jobs"
        required: false

    outputs:
      tested-sha:
        description: "Commit SHA tested and verified across all enabled jobs"
        value: ${{ jobs.z1-gate.outputs.tested-sha }}
      artifact-id:
        description: "Uploaded build artifact ID if artifact-paths was provided"
        value: ${{ jobs.b1-build.outputs.artifact-id }}

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────
  # S1: Typecheck (independent slot job)
  # ─────────────────────────────────────────────────────
  s1-typecheck:
    name: "S1: Types"
    if: inputs.typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060
        with:
          env-json: ${{ inputs.env-json }}

      - name: Prepare environment
        if: inputs.prepare-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_PREPARE: ${{ inputs.prepare-command }}
        run: |
          echo "Executing prepare-command..."
          bash -euo pipefail -c "$IN_PREPARE"

      - name: "S1: Types"
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_CMD: ${{ inputs.typecheck-command }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          CMD="$IN_CMD"
          if [ -z "$CMD" ]; then
            if [ "$PKG_MGR" = "bun" ]; then
              CMD="bun run typecheck"
            elif [ "$PKG_MGR" = "pnpm" ]; then
              CMD="pnpm run typecheck"
            else
              CMD="npm run typecheck"
            fi
          fi
          TRIMMED="${CMD//[[:space:]]/}"
          if [ -z "$TRIMMED" ] || [ "$TRIMMED" = "true" ] || [ "$TRIMMED" = ":" ]; then
            echo "::error::Invalid typecheck command '$TRIMMED'. Disable typecheck explicitly with disabled-check-reasons instead of using fake-green commands."
            exit 1
          fi
          echo "Running typecheck: $CMD"
          bash -euo pipefail -c "$CMD"

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # S2: Lint (independent slot job)
  # ─────────────────────────────────────────────────────
  s2-lint:
    name: "S2: Lint"
    if: inputs.lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060
        with:
          env-json: ${{ inputs.env-json }}

      - name: Prepare environment
        if: inputs.prepare-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_PREPARE: ${{ inputs.prepare-command }}
        run: |
          echo "Executing prepare-command..."
          bash -euo pipefail -c "$IN_PREPARE"

      - name: "S2: Lint"
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_CMD: ${{ inputs.lint-command }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          CMD="$IN_CMD"
          if [ -z "$CMD" ]; then
            if [ "$PKG_MGR" = "bun" ]; then
              CMD="bun run lint"
            elif [ "$PKG_MGR" = "pnpm" ]; then
              CMD="pnpm run lint"
            else
              CMD="npm run lint"
            fi
          fi
          TRIMMED="${CMD//[[:space:]]/}"
          if [ -z "$TRIMMED" ] || [ "$TRIMMED" = "true" ] || [ "$TRIMMED" = ":" ]; then
            echo "::error::Invalid lint command '$TRIMMED'. Disable lint explicitly with disabled-check-reasons instead of using fake-green commands."
            exit 1
          fi
          echo "Running lint: $CMD"
          bash -euo pipefail -c "$CMD"

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # L1: Unit tests + coverage. The job always runs so it can
  # validate disabled-check-reasons; the unit step itself is
  # skipped when the slot is disabled.
  # ─────────────────────────────────────────────────────
  l1-unit-tests:
    name: "L1: Unit"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
      l1-unit: ${{ steps.l1-unit.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060
        with:
          env-json: ${{ inputs.env-json }}

      - name: Validate disabled checks explanations
        shell: bash
        env:
          IN_REASONS: ${{ inputs.disabled-check-reasons }}
          TYPECHECK_ENABLED: ${{ inputs.typecheck }}
          LINT_ENABLED: ${{ inputs.lint }}
          UNIT_ENABLED: ${{ inputs.unit }}
          SECURITY_ENABLED: ${{ inputs.security }}
        run: |
          set -euo pipefail
          python3 -c '
          import os, sys, json
          reasons_str = os.environ.get("IN_REASONS", "{}")
          try:
              reasons = json.loads(reasons_str) if reasons_str else {}
          except Exception as e:
              sys.stderr.write(f"::error::disabled-check-reasons is invalid JSON: {e}\n")
              sys.exit(1)

          checks = {
              "typecheck": os.environ.get("TYPECHECK_ENABLED") == "true",
              "lint": os.environ.get("LINT_ENABLED") == "true",
              "unit": os.environ.get("UNIT_ENABLED") == "true",
              "security": os.environ.get("SECURITY_ENABLED") == "true",
          }
          for name, enabled in checks.items():
              if not enabled:
                  if name not in reasons or not str(reasons[name]).strip():
                      sys.stderr.write(f"::error::Core check \"{name}\" is disabled but missing explanation in disabled-check-reasons\n")
                      sys.exit(1)
                  print(f"Check {name} is explicitly disabled: {reasons[name]}")
          '

      - name: Prepare environment
        if: inputs.prepare-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_PREPARE: ${{ inputs.prepare-command }}
        run: |
          echo "Executing prepare-command..."
          bash -euo pipefail -c "$IN_PREPARE"

      - name: "L1: Unit"
        id: l1-unit
        if: inputs.unit
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_CMD: ${{ inputs.test-command }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          CMD="$IN_CMD"
          if [ -z "$CMD" ]; then
            if [ "$PKG_MGR" = "bun" ]; then
              CMD="bun run test:coverage"
            elif [ "$PKG_MGR" = "pnpm" ]; then
              CMD="pnpm run test:coverage"
            else
              CMD="npm run test:coverage"
            fi
          fi
          TRIMMED="${CMD//[[:space:]]/}"
          if [ -z "$TRIMMED" ] || [ "$TRIMMED" = "true" ] || [ "$TRIMMED" = ":" ]; then
            echo "::error::Invalid test command '$TRIMMED'. Disable unit explicitly with disabled-check-reasons instead of using fake-green commands."
            exit 1
          fi
          echo "Running unit tests: $CMD"
          bash -euo pipefail -c "$CMD"

      - name: Upload coverage
        if: inputs.unit && inputs.coverage-path != '' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: ${{ inputs.coverage-path }}
          retention-days: 7
          if-no-files-found: error

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # S3: Workflow lint (optional)
  # ─────────────────────────────────────────────────────
  s3-workflow-lint:
    name: "S3: Workflow"
    if: inputs.workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

      - name: Validate workflow syntax
        shell: bash
        env:
          WORKFLOW_FILES: ${{ inputs.workflow-lint-files }}
        run: |
          set -euo pipefail
          read -r -a files <<< "$WORKFLOW_FILES"
          if [ "${#files[@]}" -eq 0 ]; then
            "$RUNNER_TEMP/actionlint"
          else
            "$RUNNER_TEMP/actionlint" "${files[@]}"
          fi

      - name: Check immutable shared workflow references
        shell: bash
        env:
          WORKFLOW_FILES: ${{ inputs.workflow-lint-files }}
          REQUIRED_WORKFLOW: ${{ inputs.workflow-lint-required-workflow }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, yaml
          files = os.environ['WORKFLOW_FILES'].split() or list(pathlib.Path('.github/workflows').glob('*.y*ml'))
          references = []
          for path in files:
              data = yaml.safe_load(pathlib.Path(path).read_text())
              for job in data.get('jobs', {}).values():
                  references.extend(item['uses'] for item in [job, *job.get('steps', [])] if 'uses' in item)
          for ref in references:
              if ref.startswith('nocoo/base-ci/') and not re.fullmatch(r'nocoo/base-ci/[^@]+@[a-f0-9]{40}', ref):
                  raise SystemExit(f'Shared CI reference must use a full commit SHA: {ref}')
          required = os.environ['REQUIRED_WORKFLOW']
          if required and not any(ref.startswith(required + '@') for ref in references):
              raise SystemExit(f'Missing required reusable workflow: {required}')
          print(f'Validated {len(files)} workflow files and immutable base-ci references')
          PY

      - name: Check YAML style
        if: inputs.workflow-lint-yamllint
        shell: bash
        env:
          WORKFLOW_FILES: ${{ inputs.workflow-lint-files }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'yamllint==1.38.0'
          read -r -a files <<< "$WORKFLOW_FILES"
          if [ "${#files[@]}" = 0 ]; then files=(.github/workflows/*.yml); fi
          yamllint -d '{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}' "${files[@]}"

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # G1: Secret scan
  # ─────────────────────────────────────────────────────
  g1-secret-scan:
    name: "G1: Secrets"
    if: inputs.security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup JS and dependencies (if security-command requires runtime)
        if: inputs.security-command != ''
        uses: nocoo/base-ci/.github/actions/setup-js@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Install security scanners (gitleaks + osv-scanner)
        uses: nocoo/base-ci/.github/actions/setup-security-scanners@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060

      - name: "G1: Gitleaks Secret Scan"
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_GITLEAKS_CONFIG: ${{ inputs.gitleaks-config }}
          IN_GITLEAKS_IGNORE: ${{ inputs.gitleaks-ignore-path }}
        run: |
          set -euo pipefail
          GITLEAKS_ARGS=(detect --no-banner --verbose --redact --no-git)
          if [ -n "$IN_GITLEAKS_CONFIG" ]; then
            GITLEAKS_ARGS+=(--config="$IN_GITLEAKS_CONFIG")
          elif [ -f ".gitleaks.toml" ]; then
            GITLEAKS_ARGS+=(--config=.gitleaks.toml)
          fi
          if [ -n "$IN_GITLEAKS_IGNORE" ]; then
            GITLEAKS_ARGS+=(--gitleaks-ignore-path="$IN_GITLEAKS_IGNORE")
          elif [ -f ".gitleaksignore" ]; then
            GITLEAKS_ARGS+=(--gitleaks-ignore-path=.gitleaksignore)
          fi
          echo "Running gitleaks with args: ${GITLEAKS_ARGS[*]}"
          gitleaks "${GITLEAKS_ARGS[@]}"

      - name: Custom security command
        if: inputs.security-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_SEC_CMD: ${{ inputs.security-command }}
          CI: "true"
        run: |
          echo "Running custom security command..."
          bash -euo pipefail -c "$IN_SEC_CMD"

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # G2: Dependency vulnerabilities
  # ─────────────────────────────────────────────────────
  g2-dependency-vulnerabilities:
    name: "G2: Dependencies"
    if: inputs.security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install security scanners (gitleaks + osv-scanner)
        uses: nocoo/base-ci/.github/actions/setup-security-scanners@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060

      - name: "G2: OSV Dependency Scan"
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_LOCKFILES: ${{ inputs.lockfiles != '' && inputs.lockfiles || (inputs.package-manager == 'bun' && 'bun.lock' || (inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json')) }}
          IN_OSV_CONFIG: ${{ inputs.osv-config }}
        run: |
          set -euo pipefail

          LOCKFILES=()
          while IFS= read -r line || [ -n "$line" ]; do
            TRIMMED="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -n "$TRIMMED" ]; then
              LOCKFILES+=("$TRIMMED")
            fi
          done < <(printf '%s\n' "$IN_LOCKFILES" | tr ',' '\n')

          if [ ${#LOCKFILES[@]} -eq 0 ]; then
            echo "::error::No lockfiles specified for OSV scan."
            exit 1
          fi

          for lf in "${LOCKFILES[@]}"; do
            if [ ! -f "$lf" ]; then
              echo "::error::Lockfile '$lf' does not exist."
              exit 1
            fi
            echo "::group::Scanning lockfile: $lf"
            if [ -n "$IN_OSV_CONFIG" ]; then
              osv-scanner scan --lockfile="$lf" --config="$IN_OSV_CONFIG"
            else
              osv-scanner scan --lockfile="$lf"
            fi
            echo "::endgroup::"
          done

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # B1: Build (optional)
  # ─────────────────────────────────────────────────────
  b1-build:
    name: "B1: Build"
    if: inputs.build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload-artifact-step.outputs.artifact-id }}
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060
        with:
          env-json: ${{ inputs.env-json }}

      - name: Prepare environment
        if: inputs.prepare-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_PREPARE: ${{ inputs.prepare-command }}
        run: |
          echo "Executing prepare-command..."
          bash -euo pipefail -c "$IN_PREPARE"

      - name: Execute build
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_BUILD: ${{ inputs.build-command }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          CMD="$IN_BUILD"
          if [ -z "$CMD" ]; then
            if [ "$PKG_MGR" = "bun" ]; then
              CMD="bun run build"
            elif [ "$PKG_MGR" = "pnpm" ]; then
              CMD="pnpm run build"
            else
              CMD="npm run build"
            fi
          fi
          echo "Running build: $CMD"
          bash -euo pipefail -c "$CMD"

      - name: Upload build artifact
        id: upload-artifact-step
        if: inputs.artifact-paths != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name != '' && inputs.artifact-name || 'build-artifact' }}
          path: ${{ inputs.artifact-paths }}
          retention-days: 7
          if-no-files-found: error

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # L3: Integration (optional; l2 is a deprecated alias input)
  # ─────────────────────────────────────────────────────
  l3-integration:
    name: "L3: Integration"
    if: inputs.l2 || inputs.l3-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060
        with:
          env-json: ${{ inputs.env-json }}
          secret-env-json: ${{ secrets.test-env-json }}

      - name: Prepare environment
        if: inputs.prepare-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_PREPARE: ${{ inputs.prepare-command }}
        run: |
          echo "Executing prepare-command..."
          bash -euo pipefail -c "$IN_PREPARE"

      - name: "L3: Integration"
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_CMD: ${{ inputs.l2-command != '' && inputs.l2-command || (inputs.package-manager == 'bun' && 'bun run test:api' || 'npm run test:api') }}
        run: |
          set -euo pipefail
          echo "Running L3 Integration: $IN_CMD"
          bash -euo pipefail -c "$IN_CMD"

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload L2 evidence
        if: always() && inputs.l2-artifact-name != '' && inputs.l2-artifact-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.l2-artifact-name }}
          path: ${{ inputs.l2-artifact-path }}
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────────────────────────────────
  # L4: E2E — generic command and optional Playwright (l3 is a deprecated alias input)
  # ─────────────────────────────────────────────────────
  l4-e2e:
    name: "L4: E2E"
    if: inputs.l3 || inputs.l4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060
        with:
          env-json: ${{ inputs.env-json }}
          secret-env-json: ${{ secrets.test-env-json }}

      - name: Prepare environment
        if: inputs.l4-prepare-command != '' || inputs.l3-prepare-command != '' || inputs.prepare-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_PREPARE: ${{ inputs.l4-prepare-command != '' && inputs.l4-prepare-command || (inputs.l3-prepare-command != '' && inputs.l3-prepare-command || inputs.prepare-command) }}
        run: |
          echo "Executing L4 prepare-command..."
          bash -euo pipefail -c "$IN_PREPARE"

      - name: Install Playwright browsers
        if: inputs.l4-browsers != '' || inputs.l3-browsers != ''
        shell: bash
        working-directory: ${{ inputs.l4-browser-directory != '' && inputs.l4-browser-directory || inputs.working-directory }}
        env:
          IN_BROWSERS: ${{ inputs.l4-browsers != '' && inputs.l4-browsers || inputs.l3-browsers }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          read -r -a BROWSERS <<< "$IN_BROWSERS"
          if [ "${#BROWSERS[@]}" -eq 0 ]; then
            echo "::error::No Playwright browser requested."
            exit 1
          fi
          echo "Installing Playwright browsers: ${BROWSERS[*]}"
          if [ "$PKG_MGR" = "bun" ]; then
            bunx playwright install --with-deps "${BROWSERS[@]}"
          elif [ "$PKG_MGR" = "pnpm" ]; then
            pnpm exec playwright install --with-deps "${BROWSERS[@]}"
          else
            npx playwright install --with-deps "${BROWSERS[@]}"
          fi

      - name: "L4: E2E"
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_CMD: ${{ inputs.l4-command != '' && inputs.l4-command || (inputs.l3-command != '' && inputs.l3-command || (inputs.package-manager == 'bun' && 'bun run test:e2e:pw' || 'npm run test:e2e:pw')) }}
        run: |
          set -euo pipefail
          echo "Running L4 E2E: $IN_CMD"
          bash -euo pipefail -c "$IN_CMD"

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload L4 evidence
        if: always() && ((inputs.l4-artifact-name != '' && inputs.l4-artifact-path != '') || (inputs.l3-artifact-name != '' && inputs.l3-artifact-path != ''))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.l4-artifact-name != '' && inputs.l4-artifact-name || inputs.l3-artifact-name }}
          path: ${{ inputs.l4-artifact-path != '' && inputs.l4-artifact-path || inputs.l3-artifact-path }}
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────────────────────────────────
  # L2: Runtime (optional; worker is a deprecated alias input)
  # ─────────────────────────────────────────────────────
  l2-runtime:
    name: "L2: Runtime"
    if: inputs.worker || inputs.l2-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.worker-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060
        with:
          env-json: ${{ inputs.env-json }}
          secret-env-json: ${{ secrets.test-env-json }}

      - name: Prepare environment
        if: inputs.worker-prepare-command != ''
        shell: bash
        working-directory: ${{ inputs.worker-directory }}
        env:
          IN_PREPARE: ${{ inputs.worker-prepare-command }}
        run: |
          echo "Executing worker-prepare-command..."
          bash -euo pipefail -c "$IN_PREPARE"

      - name: "L2: Runtime"
        shell: bash
        working-directory: ${{ inputs.worker-directory }}
        env:
          IN_CMD: ${{ inputs.worker-command != '' && inputs.worker-command || (inputs.package-manager == 'bun' && 'bun run test' || 'npm run test') }}
        run: |
          set -euo pipefail
          echo "Running L2 Runtime tests: $IN_CMD"
          bash -euo pipefail -c "$IN_CMD"

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # P1: Package check (optional)
  # ─────────────────────────────────────────────────────
  p1-package-check:
    name: "P1: Package"
    if: inputs.package-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-policy: ${{ inputs.install-policy }}
          extra-install-dirs: ${{ inputs.extra-install-dirs }}

      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@6f3d30574fbd9f34c764c8c7801c5e8d6e5f5060
        with:
          env-json: ${{ inputs.env-json }}
          secret-env-json: ${{ secrets.test-env-json }}

      - name: Prepare environment
        if: inputs.prepare-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_PREPARE: ${{ inputs.prepare-command }}
        run: |
          echo "Executing prepare-command..."
          bash -euo pipefail -c "$IN_PREPARE"

      - name: "P1: Package"
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          IN_CMD: ${{ inputs.package-command != '' && inputs.package-command || (inputs.package-manager == 'bun' && 'bun run ci:package' || 'npm run ci:package') }}
        run: |
          set -euo pipefail
          echo "Running package check: $IN_CMD"
          bash -euo pipefail -c "$IN_CMD"

      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────
  # Z1 Gate: verifies the slot declarations against the jobs
  # that actually ran, then emits the shared tested SHA
  # ─────────────────────────────────────────────────────
  z1-gate:
    name: "Z1: Gate"
    needs: [s1-typecheck, s2-lint, s3-workflow-lint, g1-secret-scan, g2-dependency-vulnerabilities, b1-build, l1-unit-tests, l2-runtime, l3-integration, l4-e2e, p1-package-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.verify-all.outputs.tested-sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify slot declarations and gate results
        id: verify-all
        shell: bash
        env:
          SLOT_STATUS: ${{ inputs.slot-status }}
          SLOT_S1_ENABLED: ${{ inputs.typecheck }}
          SLOT_S1_OUTCOME: ${{ needs.s1-typecheck.result }}
          SLOT_S1_SHA: ${{ needs.s1-typecheck.outputs.tested-sha }}
          SLOT_S2_ENABLED: ${{ inputs.lint }}
          SLOT_S2_OUTCOME: ${{ needs.s2-lint.result }}
          SLOT_S2_SHA: ${{ needs.s2-lint.outputs.tested-sha }}
          SLOT_S3_ENABLED: ${{ inputs.workflow-lint }}
          SLOT_S3_OUTCOME: ${{ needs.s3-workflow-lint.result }}
          SLOT_S3_SHA: ${{ needs.s3-workflow-lint.outputs.tested-sha }}
          SLOT_G1_ENABLED: ${{ inputs.security }}
          SLOT_G1_OUTCOME: ${{ needs.g1-secret-scan.result }}
          SLOT_G1_SHA: ${{ needs.g1-secret-scan.outputs.tested-sha }}
          SLOT_G2_ENABLED: ${{ inputs.security }}
          SLOT_G2_OUTCOME: ${{ needs.g2-dependency-vulnerabilities.result }}
          SLOT_G2_SHA: ${{ needs.g2-dependency-vulnerabilities.outputs.tested-sha }}
          SLOT_B1_ENABLED: ${{ inputs.build }}
          SLOT_B1_OUTCOME: ${{ needs.b1-build.result }}
          SLOT_B1_SHA: ${{ needs.b1-build.outputs.tested-sha }}
          SLOT_L1_ENABLED: ${{ inputs.unit }}
          SLOT_L1_OUTCOME: ${{ needs.l1-unit-tests.outputs.l1-unit }}
          SLOT_L1_SHA: ${{ needs.l1-unit-tests.outputs.tested-sha }}
          SLOT_L1_JOB_RESULT: ${{ needs.l1-unit-tests.result }}
          SLOT_L2_ENABLED: ${{ inputs.worker || inputs.l2-runtime }}
          SLOT_L2_OUTCOME: ${{ needs.l2-runtime.result }}
          SLOT_L2_SHA: ${{ needs.l2-runtime.outputs.tested-sha }}
          SLOT_L3_ENABLED: ${{ inputs.l2 || inputs.l3-integration }}
          SLOT_L3_OUTCOME: ${{ needs.l3-integration.result }}
          SLOT_L3_SHA: ${{ needs.l3-integration.outputs.tested-sha }}
          SLOT_L4_ENABLED: ${{ inputs.l3 || inputs.l4 }}
          SLOT_WORKER: ${{ inputs.worker }}
          SLOT_L2_RUNTIME: ${{ inputs.l2-runtime }}
          SLOT_L2_ALIAS: ${{ inputs.l2 }}
          SLOT_L3_INTEGRATION: ${{ inputs.l3-integration }}
          SLOT_L3_ALIAS: ${{ inputs.l3 }}
          SLOT_L4_INPUT: ${{ inputs.l4 }}
          SLOT_L4_CMD: ${{ inputs.l4-command }}
          SLOT_L3_CMD: ${{ inputs.l3-command }}
          SLOT_L4_OUTCOME: ${{ needs.l4-e2e.result }}
          SLOT_L4_SHA: ${{ needs.l4-e2e.outputs.tested-sha }}
          GITHUB_TOKEN: ${{ github.token }}
          SLOT_P1_ENABLED: ${{ inputs.package-check }}
          SLOT_P1_OUTCOME: ${{ needs.p1-package-check.result }}
          SLOT_P1_SHA: ${{ needs.p1-package-check.outputs.tested-sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          # SLOT_GATE_PYTHON_BEGIN
          import json
          import os
          import sys

          SLOT_IDS = ["S1", "S2", "S3", "G1", "G2", "B1", "L1", "L2", "L3", "L4", "P1", "Z1"]
          SLOT_KEYS = {
              "S1": "S1",
              "S2": "S2",
              "S3": "S3",
              "G1": "G1",
              "G2": "G2",
              "B1": "B1",
              "L1": "L1",
              "L2": "L2",
              "L3": "L3",
              "L4": "L4",
              "P1": "P1",
          }
          DEPRECATED_SLOT_KEYS = {
              "L1.5": "Use L2 (Runtime) instead of L1.5; enable worker or l2-runtime.",
          }
          SLOT_JOB_NAMES = {
              "S1": "S1: Types",
              "S2": "S2: Lint",
              "S3": "S3: Workflow",
              "G1": "G1: Secrets",
              "G2": "G2: Dependencies",
              "B1": "B1: Build",
              "L1": "L1: Unit",
              "L2": "L2: Runtime",
              "L3": "L3: Integration",
              "L4": "L4: E2E",
              "P1": "P1: Package",
              "Z1": "Z1: Gate",
          }
          VALID_STATUSES = ("impl", "na", "todo")
          CI_TARGET_SECONDS = 5 * 60
          CI_LIMIT_SECONDS = 10 * 60


          def fail(message):
              sys.stderr.write(f"::error::{message}\n")
              sys.exit(1)


          def verify_input_aliases():
              def bool_conflict(legacy, canonical, legacy_name, canonical_name):
                  legacy_v = legacy.lower() == "true"
                  canonical_v = canonical.lower() == "true"
                  if legacy_v == canonical_v:
                      return
                  # Default false on the canonical input is not treated as an explicit disable
                  # when the legacy alias is enabled (and vice versa).
                  if legacy_v and not canonical_v:
                      return
                  if canonical_v and not legacy_v:
                      return
                  fail(
                      f"Conflicting boolean inputs {legacy_name}={legacy} and "
                      f"{canonical_name}={canonical}; use one name or matching values"
                  )

              bool_conflict(
                  os.environ.get("SLOT_WORKER", ""),
                  os.environ.get("SLOT_L2_RUNTIME", ""),
                  "worker",
                  "l2-runtime",
              )
              bool_conflict(
                  os.environ.get("SLOT_L2_ALIAS", ""),
                  os.environ.get("SLOT_L3_INTEGRATION", ""),
                  "l2",
                  "l3-integration",
              )
              bool_conflict(
                  os.environ.get("SLOT_L3_ALIAS", ""),
                  os.environ.get("SLOT_L4_INPUT", ""),
                  "l3",
                  "l4",
              )

              l4_cmd = os.environ.get("SLOT_L4_CMD", "").strip()
              l3_cmd = os.environ.get("SLOT_L3_CMD", "").strip()
              if l4_cmd and l3_cmd and l4_cmd != l3_cmd:
                  fail("Conflicting l4-command and l3-command; set only one or matching values")


          def collect_slots():
              slots = {}
              for slot in SLOT_IDS:
                  if slot == "Z1":
                      slots[slot] = {"enabled": True, "outcome": "success", "sha": ""}
                      continue
                  key = SLOT_KEYS[slot]
                  enabled = os.environ.get(f"SLOT_{key}_ENABLED", "")
                  outcome = os.environ.get(f"SLOT_{key}_OUTCOME", "") or "not_run"
                  sha = os.environ.get(f"SLOT_{key}_SHA", "")
                  slots[slot] = {"enabled": enabled == "true", "outcome": outcome, "sha": sha}
              return slots


          def require_l1_job():
              result = os.environ.get("SLOT_L1_JOB_RESULT", "")
              if result != "success":
                  fail(f"The L1 job finished with result '{result}'")
              if not os.environ.get("SLOT_L1_SHA", ""):
                  fail("The L1 job did not report a tested SHA")


          def verify_legacy(slots):
              require_l1_job()
              verified = []
              for slot in SLOT_IDS:
                  if slot == "Z1":
                      continue
                  state = slots[slot]
                  if state["enabled"]:
                      if state["outcome"] != "success":
                          fail(f"Required slot {slot} finished with outcome '{state['outcome']}'")
                      if not state["sha"]:
                          fail(f"Required slot {slot} did not report a tested SHA")
                      verified.append((slot, state["sha"]))
                  elif state["outcome"] not in ("skipped", "not_run"):
                      fail(f"Disabled slot {slot} was not skipped (outcome '{state['outcome']}')")
              verified.append(("L1 job", os.environ["SLOT_L1_SHA"]))
              return verified


          def verify_strict(raw, slots):
              require_l1_job()
              try:
                  declarations = json.loads(raw)
              except json.JSONDecodeError as exc:
                  fail(f"slot-status is not valid JSON: {exc}")
              if not isinstance(declarations, dict):
                  fail("slot-status must be a JSON object")
              for deprecated, hint in DEPRECATED_SLOT_KEYS.items():
                  if deprecated in declarations:
                      fail(f"slot-status uses deprecated slot {deprecated}. {hint}")
              unknown = sorted(set(declarations) - set(SLOT_IDS) - set(DEPRECATED_SLOT_KEYS))
              if unknown:
                  fail(f"slot-status declares unknown slots: {', '.join(unknown)}")
              missing = [slot for slot in SLOT_IDS if slot not in declarations]
              if missing:
                  fail(f"slot-status is missing slot declarations: {', '.join(missing)}")
              for slot in SLOT_IDS:
                  entry = declarations[slot]
                  if not isinstance(entry, dict):
                      fail(f"slot-status entry for {slot} must be an object")
                  status = entry.get("status")
                  if status not in VALID_STATUSES:
                      fail(f"slot-status entry for {slot} has an invalid status '{status}'")
                  if status in ("na", "todo"):
                      reason = entry.get("reason")
                      if not isinstance(reason, str) or not reason.strip():
                          fail(f"slot-status entry for {slot} requires a non-empty reason")
                  if slot == "Z1" and status != "impl":
                      fail("slot-status entry for Z1 must be impl")
              verified = []
              for slot in SLOT_IDS:
                  if slot == "Z1":
                      continue
                  status = declarations[slot]["status"]
                  state = slots[slot]
                  if status == "impl":
                      if not state["enabled"]:
                          fail(f"Slot {slot} is declared impl but its job or step is not enabled")
                      if state["outcome"] != "success":
                          fail(f"Slot {slot} is declared impl but finished with outcome '{state['outcome']}'")
                      if not state["sha"]:
                          fail(f"Slot {slot} is declared impl but did not report a tested SHA")
                      verified.append((slot, state["sha"]))
                  else:
                      if state["enabled"]:
                          fail(f"Slot {slot} is declared {status} but its job or step is enabled")
                      if state["outcome"] not in ("skipped", "not_run"):
                          fail(f"Slot {slot} is declared {status} but its job or step ran with outcome '{state['outcome']}'")
              if not verified:
                  fail("slot-status declares no implemented slot besides Z1")
              verified.append(("L1 job", os.environ["SLOT_L1_SHA"]))
              return verified, declarations


          def fetch_run_metadata():
              import urllib.request

              token = os.environ.get("GITHUB_TOKEN", "").strip()
              repo = os.environ.get("GITHUB_REPOSITORY", "").strip()
              run_id = os.environ.get("GITHUB_RUN_ID", "").strip()
              api = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
              if not (token and repo and run_id):
                  return None, {}
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "nocoo-base-ci-z1-gate",
              }

              def get_json(url):
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.loads(response.read().decode("utf-8"))

              try:
                  run = get_json(f"{api}/repos/{repo}/actions/runs/{run_id}")
                  jobs_payload = get_json(f"{api}/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100")
              except Exception as exc:
                  print(f"Z1 summary: unable to load Actions metadata ({exc})", file=sys.stderr)
                  return None, {}

              durations = {}
              for job in jobs_payload.get("jobs", []):
                  name = job.get("name", "")
                  started = job.get("started_at") or ""
                  completed = job.get("completed_at") or ""
                  seconds = ""
                  if started and completed:
                      try:
                          from datetime import datetime

                          fmt = "%Y-%m-%dT%H:%M:%SZ"
                          delta = datetime.strptime(completed, fmt) - datetime.strptime(started, fmt)
                          seconds = int(delta.total_seconds())
                      except Exception:
                          seconds = ""
                  durations[name] = {
                      "result": job.get("conclusion") or job.get("status") or "",
                      "seconds": seconds,
                  }
              run_seconds = ""
              if run.get("run_started_at") and run.get("updated_at"):
                  try:
                      from datetime import datetime

                      fmt = "%Y-%m-%dT%H:%M:%SZ"
                      delta = datetime.strptime(run["updated_at"], fmt) - datetime.strptime(run["run_started_at"], fmt)
                      run_seconds = int(delta.total_seconds())
                  except Exception:
                      run_seconds = ""
              return {
                  "run_seconds": run_seconds,
                  "queue_seconds": "",
              }, durations


          def declaration_row(slot, slots, declarations, legacy):
              if legacy:
                  state = slots.get(slot, {})
                  if slot == "Z1":
                      return "impl", "", "success"
                  if state.get("enabled"):
                      return "impl", "", state.get("outcome", "")
                  return "off", "not enabled (legacy boolean inputs)", state.get("outcome", "skipped")
              entry = declarations.get(slot, {})
              status = entry.get("status", "")
              reason = entry.get("reason", "") if status in ("na", "todo") else ""
              state = slots.get(slot, {})
              result = state.get("outcome", "")
              if slot == "Z1":
                  result = "success"
              return status, reason, result


          def format_duration(seconds):
              if seconds == "" or seconds is None:
                  return "—"
              try:
                  seconds = int(seconds)
              except Exception:
                  return "—"
              minutes, secs = divmod(seconds, 60)
              if minutes:
                  return f"{minutes}m {secs}s"
              return f"{secs}s"


          def write_step_summary(mode, slots, declarations, legacy):
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")
              if not summary_path:
                  return
              run_meta, job_durations = fetch_run_metadata()
              lines = [
                  "## Z1 Gate — System0 quality slots",
                  "",
                  f"Mode: **{mode}**",
                  "",
                  "| Slot | Check | Status | Reason | Result | Duration |",
                  "| --- | --- | --- | --- | --- | --- |",
              ]
              for slot in SLOT_IDS:
                  status, reason, result = declaration_row(slot, slots, declarations or {}, legacy)
                  if legacy and slot != "Z1" and status == "off":
                      display_status = "na"
                  else:
                      display_status = status
                  job_name = SLOT_JOB_NAMES.get(slot, slot)
                  duration = "—"
                  if job_name in job_durations:
                      duration = format_duration(job_durations[job_name].get("seconds", ""))
                      if not result:
                          result = job_durations[job_name].get("result", result)
                  reason_cell = reason.replace("|", "\\|") if reason else "—"
                  lines.append(
                      f"| {slot} | {job_name} | {display_status} | {reason_cell} | {result or '—'} | {duration} |"
                  )
              lines.append("")
              if run_meta and run_meta.get("run_seconds") != "":
                  total = int(run_meta["run_seconds"])
                  target = "met" if total <= CI_TARGET_SECONDS else "above target"
                  limit = "within limit" if total <= CI_LIMIT_SECONDS else "above 10m reference"
                  lines.append(
                      f"**Workflow duration:** {format_duration(total)} ({target}; {limit}; targets 5m / 10m reference)"
                  )
              else:
                  lines.append("**Workflow duration:** unavailable (Actions metadata not readable)")
              lines.append("")
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")


          def main():
              verify_input_aliases()
              raw = os.environ.get("SLOT_STATUS", "")
              slots = collect_slots()
              declarations = None
              if raw == "":
                  mode = "legacy"
                  verified = verify_legacy(slots)
                  legacy = True
              else:
                  mode = "strict"
                  verified, declarations = verify_strict(raw, slots)
                  legacy = False
              first_slot, first_sha = verified[0]
              for slot, sha in verified[1:]:
                  if sha != first_sha:
                      fail(f"Commit SHA mismatch between slot {first_slot} and slot {slot}")
              print(f"Slot gate mode: {mode}")
              for slot in SLOT_IDS:
                  state = slots[slot]
                  print(f"  {slot:5} enabled={str(state['enabled']):5} outcome={state['outcome']:10} sha={state['sha']}")
              print(f"All {len(verified)} verified slots agree on commit SHA: {first_sha}")
              write_step_summary(mode, slots, declarations, legacy)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"tested-sha={first_sha}\n")


          main()
          # SLOT_GATE_PYTHON_END
          PY
