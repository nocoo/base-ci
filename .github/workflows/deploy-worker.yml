# Reusable Workers deployment (D1-D5, same-run quality-gated). Pin callers to a full commit SHA.
# Internal composite: nocoo/base-ci/.github/actions/setup-js@617779398889d48f867f463b05ffd0b7561376d3 (see .github/internal-provider-pin.txt)
# Do not change internal pins to relative paths (caller checkout is consumer source).

name: Deploy Worker

on:
  workflow_call:
    inputs:
      package-manager:
        description: bun, npm, or pnpm
        type: string
        default: "bun"
      runtime-version:
        description: Exact Bun or pnpm version; required for bun and pnpm (never latest)
        type: string
        default: ""
      node-version:
        description: Exact Node version; required for npm and pnpm
        type: string
        default: ""
      working-directory:
        description: Install and artifact root directory relative to the repository root
        type: string
        default: "."
      extra-install-dirs:
        description: Newline or comma separated extra frozen-install directories
        type: string
        default: ""
      install-policy:
        description: "setup-js lifecycle policy: blocked, trusted, or project"
        type: string
        default: "blocked"
      sparse-checkout:
        description: Optional multiline sparse-checkout patterns (cone mode disabled when set)
        type: string
        default: ""

      artifact-name:
        description: Optional B1 build artifact name from the same pipeline run (preferred over build-command)
        type: string
        default: ""
      artifact-path:
        description: Repository-relative target directory to extract artifact-name into
        type: string
        default: "."
      artifact-unpack-command:
        description: Optional shell command run after downloading artifact-name (at working-directory)
        type: string
        default: ""
      build-command:
        description: Optional fallback build command when no B1 artifact is consumed (empty skips)
        type: string
        default: ""

      deploy-cli:
        description: Project-local deployment CLI (wrangler or cf)
        type: string
        default: "wrangler"
      wrangler-version:
        description: Exact local Wrangler version, or lockfile to read lockfiles under working-directory (empty defaults to lockfile)
        type: string
        default: "lockfile"
      cf-version:
        description: Exact local cf version; required when shared steps use cf
        type: string
        default: ""
      wrangler-config:
        description: Optional --config path relative to wrangler-working-directory
        type: string
        default: ""
      wrangler-working-directory:
        description: Directory for Wrangler commands; empty uses working-directory
        type: string
        default: ""
      deploy-command:
        description: "CLI subcommand; empty uses deploy for Wrangler, deploy --prebuilt --mode production for cf"
        type: string
        default: ""
      deploy-script:
        description: Project deploy command; skips CLI validation unless shared D1 migrations are enabled
        type: string
        default: ""
      deploy-env:
        description: Optional newline-separated KEY=VALUE env pairs exposed to deploy and verify steps
        type: string
        default: ""
      deploy-secret-name:
        description: Optional environment variable name populated from secrets.DEPLOY_SECRET
        type: string
        default: ""

      d1-migrations:
        description: Apply remote D1 migrations before deploy
        type: boolean
        default: false
      d1-databases:
        description: Newline or comma separated D1 names for Wrangler, database UUIDs for cf
        type: string
        default: ""
      d1-command:
        description: Full selected CLI D1 subcommand; overrides d1-databases (cf accepts --dir, --pattern, --table)
        type: string
        default: ""

      environment:
        description: GitHub environment on the deploy job (not a Wrangler env name)
        type: string
        default: "production"
      concurrency-group:
        description: Production lock group; empty uses deploy-worker-<repo>-<environment>
        type: string
        default: ""
      timeout-minutes:
        description: Deploy job timeout
        type: number
        default: 20
      verify-command:
        description: Mandatory production verify command
        type: string
        required: true
      verify-retries:
        description: Bounded verify attempts (1-12)
        type: number
        default: 6
      verify-retry-seconds:
        description: Seconds between verify attempts
        type: number
        default: 5

    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      DEPLOY_SECRET:
        required: false

    outputs:
      target-sha:
        description: Deployed commit SHA
        value: ${{ jobs.deploy.outputs.target-sha }}
      source-run-id:
        description: Pipeline Actions run ID
        value: ${{ jobs.deploy.outputs.source-run-id }}

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: ${{ inputs.concurrency-group != '' && inputs.concurrency-group || format('deploy-worker-{0}-{1}', github.repository, inputs.environment) }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      target-sha: ${{ github.sha }}
      source-run-id: ${{ format('{0}', github.run_id) }}
    steps:
      - name: "D1: Preflight — Verify main ref and inputs"
        env:
          GITHUB_REF: ${{ github.ref }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          RUNTIME_VERSION: ${{ inputs.runtime-version }}
          NODE_VERSION: ${{ inputs.node-version }}
          DEPLOY_CLI: ${{ inputs.deploy-cli }}
          DEPLOY_SCRIPT: ${{ inputs.deploy-script }}
          DEPLOY_SECRET_NAME: ${{ inputs.deploy-secret-name }}
          WRANGLER_VERSION: ${{ inputs.wrangler-version }}
          CF_VERSION: ${{ inputs.cf-version }}
          WRANGLER_CONFIG: ${{ inputs.wrangler-config }}
          WRANGLER_WORKING_DIRECTORY: ${{ inputs.wrangler-working-directory }}
          INSTALL_POLICY: ${{ inputs.install-policy }}
          D1_MIGRATIONS: ${{ inputs.d1-migrations }}
          D1_DATABASES: ${{ inputs.d1-databases }}
          D1_COMMAND: ${{ inputs.d1-command }}
          VERIFY_COMMAND: ${{ inputs.verify-command }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::deploy-worker must run only on refs/heads/main (got $GITHUB_REF)"
            exit 1
          fi
          if [ -z "${VERIFY_COMMAND// /}" ]; then
            echo "::error::verify-command is mandatory (D5: Verify)"
            exit 1
          fi
          exact='^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$'
          case "$PACKAGE_MANAGER" in
            bun|npm|pnpm) ;;
            *) echo "::error::package-manager must be bun, npm, or pnpm"; exit 1 ;;
          esac
          case "$INSTALL_POLICY" in
            blocked|trusted|project) ;;
            *) echo "::error::install-policy must be blocked, trusted, or project"; exit 1 ;;
          esac
          if [ -n "$DEPLOY_SECRET_NAME" ] && [[ ! "$DEPLOY_SECRET_NAME" =~ ^[A-Z][A-Z0-9_]*$ ]]; then
            echo "::error::deploy-secret-name must match ^[A-Z][A-Z0-9_]*$"
            exit 1
          fi
          wrangler_from_lockfile=0
          case "$DEPLOY_CLI" in
            wrangler)
              if [ -z "$WRANGLER_VERSION" ] || [ "$WRANGLER_VERSION" = "lockfile" ]; then
                wrangler_from_lockfile=1
              else
                version=$WRANGLER_VERSION
              fi
              ;;
            cf)
              version=$CF_VERSION
              if [ -n "$WRANGLER_CONFIG" ] || [ -n "$WRANGLER_WORKING_DIRECTORY" ]; then
                echo "::error::cf uses working-directory and cloudflare.config.ts, not Wrangler path inputs"
                exit 1
              fi
              ;;
            *) echo "::error::deploy-cli must be wrangler or cf"; exit 1 ;;
          esac
          if [ -z "$DEPLOY_SCRIPT" ] || [ "$D1_MIGRATIONS" = "true" ]; then
            if [ "$wrangler_from_lockfile" -eq 0 ]; then
              if [[ ! "$version" =~ $exact ]]; then
                if [ "$DEPLOY_CLI" = "wrangler" ]; then
                  echo "::error::wrangler-version must be an exact version, lockfile, or empty"
                else
                  echo "::error::cf-version must be an exact version, not latest"
                fi
                exit 1
              fi
            fi
          fi
          if [ "$PACKAGE_MANAGER" = "bun" ] || [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            if [[ ! "$RUNTIME_VERSION" =~ $exact ]]; then
              echo "::error::runtime-version must be an exact $PACKAGE_MANAGER version, not latest"
              exit 1
            fi
          fi
          if [ "$PACKAGE_MANAGER" = "npm" ] || [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            if [[ ! "$NODE_VERSION" =~ $exact ]]; then
              echo "::error::node-version must be an exact Node version, not latest"
              exit 1
            fi
          fi
          if [ "$D1_MIGRATIONS" = "true" ] && [ -z "$D1_DATABASES" ] && [ -z "$D1_COMMAND" ]; then
            echo "::error::d1-migrations requires d1-databases or d1-command"
            exit 1
          fi

      - name: "D1: Preflight — Checkout (sparse)"
        if: inputs.sparse-checkout != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ inputs.sparse-checkout }}

      - name: "D1: Preflight — Checkout"
        if: inputs.sparse-checkout == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none

      - name: "D1: Preflight — Normalize paths and credentials"
        id: paths
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          WRANGLER_WORKING_DIRECTORY: ${{ inputs.wrangler-working-directory }}
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
          WRANGLER_CONFIG: ${{ inputs.wrangler-config }}
          EXTRA_INSTALL_DIRS: ${{ inputs.extra-install-dirs }}
          DEPLOY_ENV: ${{ inputs.deploy-env }}
          DEPLOY_SECRET_NAME: ${{ inputs.deploy-secret-name }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          def rel(name, value, allow_empty=False, default="."):
              raw = (value or "").strip()
              if not raw:
                  if allow_empty:
                      return default
                  print(f"::error::{name} is required", file=sys.stderr)
                  sys.exit(1)
              if raw in (".", "./"):
                  return "."
              parts = raw.replace("\\", "/").split("/")
              if raw.startswith("/") or raw.startswith("~") or ".." in parts or ":" in raw:
                  print(f"::error::{name} must be a relative path inside the repository", file=sys.stderr)
                  sys.exit(1)
              return "/".join(part for part in parts if part not in ("", "."))

          if not os.environ.get("CLOUDFLARE_API_TOKEN"):
              print("::error::CLOUDFLARE_API_TOKEN is empty in the deployment environment", file=sys.stderr)
              sys.exit(1)
          if not os.environ.get("CLOUDFLARE_ACCOUNT_ID"):
              print("::error::CLOUDFLARE_ACCOUNT_ID is empty in the deployment environment", file=sys.stderr)
              sys.exit(1)

          workdir = rel("working-directory", os.environ.get("WORKING_DIRECTORY", "."))
          wrangler_wd = rel("wrangler-working-directory", os.environ.get("WRANGLER_WORKING_DIRECTORY", ""), True, workdir)
          artifact_path = rel("artifact-path", os.environ.get("ARTIFACT_PATH", "."), True, ".")
          config = (os.environ.get("WRANGLER_CONFIG") or "").strip()
          if config:
              rel("wrangler-config", config)
          extras = []
          for item in (os.environ.get("EXTRA_INSTALL_DIRS") or "").replace(",", "\n").splitlines():
              item = item.strip()
              if item:
                  extras.append(rel("extra-install-dirs", item))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"working-directory={workdir}\n")
              fh.write(f"wrangler-working-directory={wrangler_wd}\n")
              fh.write(f"artifact-path={artifact_path}\n")
              fh.write("extra-install-dirs<<EOF\n")
              fh.write("\n".join(extras) + ("\n" if extras else ""))
              fh.write("EOF\n")

          env_lines = []
          for raw_line in (os.environ.get("DEPLOY_ENV") or "").splitlines():
              line = raw_line.strip()
              if not line:
                  continue
              if "=" not in line:
                  print(f"::error::Invalid deploy-env entry (expected KEY=VALUE): {line}", file=sys.stderr)
                  sys.exit(1)
              k, v = line.split("=", 1)
              if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", k):
                  print(f"::error::Invalid deploy-env variable name: {k}", file=sys.stderr)
                  sys.exit(1)
              env_lines.append((k, v))

          secret_name = (os.environ.get("DEPLOY_SECRET_NAME") or "").strip()
          secret_val = os.environ.get("DEPLOY_SECRET") or ""
          if secret_name and secret_val:
              env_lines.append((secret_name, secret_val))

          if env_lines:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as efh:
                  for k, v in env_lines:
                      efh.write(f"{k}<<__BASE_CI_EOF__\n{v}\n__BASE_CI_EOF__\n")
          PY

      - name: "D1: Preflight — Resolve locked Wrangler version"
        if: >-
          inputs.deploy-cli == 'wrangler' &&
          (inputs.wrangler-version == '' || inputs.wrangler-version == 'lockfile') &&
          (inputs.deploy-script == '' || inputs.d1-migrations)
        id: locked-wrangler
        uses: nocoo/base-ci/.github/actions/resolve-locked-wrangler@617779398889d48f867f463b05ffd0b7561376d3
        with:
          working-directory: ${{ steps.paths.outputs.working-directory }}

      - name: "D1: Preflight — Setup JS"
        uses: nocoo/base-ci/.github/actions/setup-js@617779398889d48f867f463b05ffd0b7561376d3
        with:
          package-manager: ${{ inputs.package-manager }}
          runtime-version: ${{ inputs.runtime-version }}
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ steps.paths.outputs.working-directory }}
          extra-install-dirs: ${{ steps.paths.outputs.extra-install-dirs }}
          install-policy: ${{ inputs.install-policy }}

      - name: "D1: Preflight — Locate locked deployment CLI"
        if: inputs.deploy-script == '' || inputs.d1-migrations
        id: cli
        env:
          DEPLOY_CLI: ${{ inputs.deploy-cli }}
          CLI_VERSION: ${{ inputs.deploy-cli == 'cf' && inputs.cf-version || (steps.locked-wrangler.outputs.wrangler-version != '' && steps.locked-wrangler.outputs.wrangler-version || inputs.wrangler-version) }}
          WRANGLER_WD: ${{ steps.paths.outputs.wrangler-working-directory }}
          WORKDIR: ${{ steps.paths.outputs.working-directory }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess, sys

          cli = os.environ["DEPLOY_CLI"]
          def abs_bin(root):
              return os.path.abspath(os.path.join(root, "node_modules", ".bin", cli))

          workspace = os.environ["GITHUB_WORKSPACE"]
          candidates = []
          for raw in (os.environ.get("WRANGLER_WD", ""), os.environ.get("WORKDIR", ""), workspace):
              raw = raw.strip() or "."
              root = raw if os.path.isabs(raw) else os.path.abspath(os.path.join(workspace, raw))
              candidates.append(abs_bin(root))
          bin_path = next((path for path in candidates if os.path.isfile(path) and os.access(path, os.X_OK)), "")
          if not bin_path:
              print(f"::error::Locked local {cli} binary not found after frozen install", file=sys.stderr)
              sys.exit(1)
          reported = subprocess.check_output([bin_path, "--version"], text=True, stderr=subprocess.STDOUT).strip()
          expected = os.environ["CLI_VERSION"]
          match = re.search(r"(\d+\.\d+\.\d+(?:[.-][A-Za-z0-9.-]+)?)", reported)
          parsed = match.group(1) if match else ""
          if parsed != expected:
              print(f"::error::Local {cli} '{reported}' parsed '{parsed}', expected {expected}", file=sys.stderr)
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"bin={bin_path}\n")
          print(f"Using {bin_path} ({parsed})")
          PY

      - name: "D2: Artifact — Download CI build artifact"
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ steps.paths.outputs.artifact-path }}

      - name: "D2: Artifact — Unpack CI build artifact"
        if: inputs.artifact-unpack-command != ''
        working-directory: ${{ steps.paths.outputs.working-directory }}
        env:
          UNPACK_COMMAND: ${{ inputs.artifact-unpack-command }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash -euo pipefail -c "$UNPACK_COMMAND"

      - name: "D2: Artifact — Build"
        if: inputs.build-command != ''
        working-directory: ${{ steps.paths.outputs.working-directory }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"

      - name: "D3: Migrate — Apply D1 migrations"
        if: inputs.d1-migrations
        working-directory: ${{ steps.paths.outputs.wrangler-working-directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_CLI: ${{ inputs.deploy-cli }}
          CLI_BIN: ${{ steps.cli.outputs.bin }}
          WRANGLER_CONFIG: ${{ inputs.wrangler-config }}
          D1_COMMAND: ${{ inputs.d1-command }}
          D1_DATABASES: ${{ inputs.d1-databases }}
        run: |
          set -euo pipefail
          set -f
          config=()
          if [ -n "$WRANGLER_CONFIG" ]; then
            config+=(--config "$WRANGLER_CONFIG")
          fi
          if [ -n "$D1_COMMAND" ]; then
            "$CLI_BIN" $D1_COMMAND "${config[@]}"
            exit 0
          fi
          while IFS= read -r db || [ -n "${db:-}" ]; do
            db=${db//$'\r'/}
            [ -n "$db" ] || continue
            if [ "$DEPLOY_CLI" = "cf" ]; then
              if [[ ! "$db" =~ ^[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}$ ]]; then
                echo "::error::cf D1 migrations require database UUIDs, not names or bindings"
                exit 1
              fi
              "$CLI_BIN" d1 migrations apply "$db"
            else
              if [[ ! "$db" =~ ^[A-Za-z0-9_-]+$ ]]; then
                echo "::error::Invalid D1 database name"
                exit 1
              fi
              "$CLI_BIN" d1 migrations apply "$db" --remote "${config[@]}"
            fi
          done < <(printf '%s\n' "$D1_DATABASES" | tr ',' '\n')

      - name: "D4: Deploy — Run project deploy script"
        if: inputs.deploy-script != ''
        working-directory: ${{ steps.paths.outputs.wrangler-working-directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_SHA: ${{ github.sha }}
          DEPLOY_SCRIPT: ${{ inputs.deploy-script }}
        run: bash -euo pipefail -c "$DEPLOY_SCRIPT"

      - name: "D4: Deploy — Deploy Worker"
        if: inputs.deploy-script == ''
        working-directory: ${{ steps.paths.outputs.wrangler-working-directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_SHA: ${{ github.sha }}
          DEPLOY_CLI: ${{ inputs.deploy-cli }}
          CLI_BIN: ${{ steps.cli.outputs.bin }}
          WRANGLER_CONFIG: ${{ inputs.wrangler-config }}
          DEPLOY_COMMAND: ${{ inputs.deploy-command }}
        run: |
          set -euo pipefail
          set -f
          config=()
          if [ -n "$WRANGLER_CONFIG" ]; then
            config+=(--config "$WRANGLER_CONFIG")
          fi
          if [ -z "$DEPLOY_COMMAND" ]; then
            if [ "$DEPLOY_CLI" = "cf" ]; then
              DEPLOY_COMMAND='deploy --prebuilt --mode production'
            else
              DEPLOY_COMMAND=deploy
            fi
          fi
          "$CLI_BIN" $DEPLOY_COMMAND "${config[@]}"

      - name: "D5: Verify — Production health check"
        working-directory: ${{ steps.paths.outputs.working-directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_SHA: ${{ github.sha }}
          VERIFY_COMMAND: ${{ inputs.verify-command }}
          VERIFY_RETRIES: ${{ inputs.verify-retries }}
          VERIFY_RETRY_SECONDS: ${{ inputs.verify-retry-seconds }}
        run: |
          set -euo pipefail
          retries=$VERIFY_RETRIES
          delay=$VERIFY_RETRY_SECONDS
          if ! [[ "$retries" =~ ^[0-9]+$ ]] || [ "$retries" -lt 1 ] || [ "$retries" -gt 12 ]; then
            echo "::error::verify-retries must be between 1 and 12"
            exit 1
          fi
          if ! [[ "$delay" =~ ^[0-9]+$ ]] || [ "$delay" -gt 60 ]; then
            echo "::error::verify-retry-seconds must be between 0 and 60"
            exit 1
          fi
          i=1
          while [ "$i" -le "$retries" ]; do
            echo "verify attempt $i/$retries"
            if bash -euo pipefail -c "$VERIFY_COMMAND"; then
              exit 0
            fi
            if [ "$i" -eq "$retries" ]; then
              echo "::error::verify-command failed after $retries attempts"
              exit 1
            fi
            sleep "$delay"
            i=$((i + 1))
          done

      - name: Summary
        if: always()
        env:
          TARGET_SHA: ${{ github.sha }}
          SOURCE_RUN: ${{ format('{0}', github.run_id) }}
          ENVIRONMENT: ${{ inputs.environment }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          {
            echo "### Deploy Worker (D1-D5)"
            echo ""
            echo "- Environment: \`$ENVIRONMENT\`"
            echo "- Pipeline Run: \`$SOURCE_RUN\`"
            echo "- SHA: \`$TARGET_SHA\`"
            if [ -n "$ARTIFACT_NAME" ]; then
              echo "- B1 Artifact: \`$ARTIFACT_NAME\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
