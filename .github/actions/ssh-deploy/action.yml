name: SSH Deploy
description: 通过 SSH 在远程服务器执行部署脚本（替代 appleboy/ssh-action，零第三方依赖）

inputs:
  host:
    description: SSH 目标主机
    required: true
  user:
    description: SSH 用户
    required: true
  port:
    description: SSH 端口
    required: false
    default: "22"
  key:
    description: SSH 私钥（PEM 格式，整段，包含 BEGIN/END 行）
    required: true
  envs:
    description: |
      要从 runner 环境带到远端的环境变量名，空格分隔。
      例如 envs: "IMAGE_SHA BUILD_ID"。
      对应变量必须在调用方 step 的 `env:` 块里设置好。
    required: false
    default: ""
  script:
    description: 在远端执行的 bash 脚本（多行）
    required: true
  known-hosts:
    description: |
      预置 host key 列表（多行，每行一条 ssh-keyscan 输出）。
      留空则现场用 ssh-keyscan 抓 host key（TOFU：抓到的 key 写入 known_hosts，
      之后的连接按 StrictHostKeyChecking=yes 校验）。
      生产场景建议预先 ssh-keyscan 后存入 GitHub secret 传入。
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup SSH
      shell: bash
      env:
        DEPLOY_KEY: ${{ inputs.key }}
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_PORT: ${{ inputs.port }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        set -euo pipefail
        workdir="${RUNNER_TEMP:-/tmp}"
        mkdir -p "$workdir"

        # 私钥与 host key 都落在本次调用专属的临时文件里：
        # 不写 ~/.ssh，不复用固定路径，cleanup 时整份删掉。
        DEPLOY_KEY_FILE=""
        DEPLOY_KH_FILE=""
        # 单引号：变量在 trap 触发时才展开，任何一步失败都能删掉当时已建的文件
        trap 'rm -f "${DEPLOY_KEY_FILE:-}" "${DEPLOY_KH_FILE:-}"' EXIT

        DEPLOY_KEY_FILE=$(mktemp "$workdir/ssh_deploy_key.XXXXXX")
        echo "DEPLOY_KEY_FILE=$DEPLOY_KEY_FILE" >> "$GITHUB_ENV"

        DEPLOY_KH_FILE=$(mktemp "$workdir/ssh_deploy_known_hosts.XXXXXX")
        echo "DEPLOY_KH_FILE=$DEPLOY_KH_FILE" >> "$GITHUB_ENV"

        printf '%s\n' "$DEPLOY_KEY" > "$DEPLOY_KEY_FILE"
        chmod 600 "$DEPLOY_KEY_FILE"

        # host key 只信任本次调用提供的（或现场抓到的）材料
        if [ -n "$KNOWN_HOSTS" ]; then
          printf '%s\n' "$KNOWN_HOSTS" > "$DEPLOY_KH_FILE"
        else
          # 没有预置 known_hosts，现场抓取（TOFU：抓到的 key 就是本次唯一的信任源）
          ssh-keyscan -T 10 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > "$DEPLOY_KH_FILE" 2>/dev/null || true
        fi
        if ! grep -qvE '^[[:space:]]*(#|$)' "$DEPLOY_KH_FILE"; then
          echo "::error::no host key for ${DEPLOY_HOST}:${DEPLOY_PORT} — pass known-hosts: or check that the host is reachable"
          exit 1
        fi
        chmod 600 "$DEPLOY_KH_FILE"

        # Setup 成功：取消 EXIT trap，临时文件留给 Execute step
        trap - EXIT

    - name: Execute remote script
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_USER: ${{ inputs.user }}
        DEPLOY_PORT: ${{ inputs.port }}
        DEPLOY_ENVS: ${{ inputs.envs }}
        DEPLOY_SCRIPT: ${{ inputs.script }}
      run: |
        set -euo pipefail
        : "${DEPLOY_KEY_FILE:?deploy key file path is missing — the Setup SSH step did not run}"
        : "${DEPLOY_KH_FILE:?deploy known hosts file path is missing — the Setup SSH step did not run}"

        # 把 envs: 列出的变量序列化成 `export KEY=bash_quoted_value` 行，
        # 然后把它们和用户脚本拼在一起整体送进远端 `bash -s` 的 stdin。
        # 远端用户的登录 shell（可能是 dash/sh/zsh）只看到固定的 `bash -s` 命令，
        # 不会去解析 env 值，因此 `printf '%q'` 的 bash quote 一定由 bash 自己解析，
        # 不会被中间的非 bash 登录 shell 静默改写（newline/tab 等也安全）。
        EXPORTS=""
        if [ -n "$DEPLOY_ENVS" ]; then
          for var_name in $DEPLOY_ENVS; do
            if [ -z "${!var_name+x}" ]; then
              echo "::warning::env var '$var_name' listed in envs: but unset in runner environment; skipping"
              continue
            fi
            quoted=$(printf '%q' "${!var_name}")
            EXPORTS+="export ${var_name}=${quoted}"$'\n'
          done
        fi

        REMOTE_PAYLOAD="${EXPORTS}${DEPLOY_SCRIPT}"

        ssh \
          -i "$DEPLOY_KEY_FILE" \
          -p "$DEPLOY_PORT" \
          -o BatchMode=yes \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="$DEPLOY_KH_FILE" \
          -o GlobalKnownHostsFile=/dev/null \
          -o UpdateHostKeys=no \
          -o ConnectTimeout=30 \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          "${DEPLOY_USER}@${DEPLOY_HOST}" \
          'bash -s' <<< "$REMOTE_PAYLOAD"

    - name: Cleanup SSH key and known hosts
      if: always()
      shell: bash
      run: |
        if [ -n "${DEPLOY_KEY_FILE:-}" ]; then rm -f "$DEPLOY_KEY_FILE"; fi
        if [ -n "${DEPLOY_KH_FILE:-}" ]; then rm -f "$DEPLOY_KH_FILE"; fi
