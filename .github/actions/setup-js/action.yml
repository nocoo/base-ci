name: "Setup JS and Dependencies"
description: "Resolve package manager, runtime version, freeze-install root and extra directories with supply-chain policy enforcement"

inputs:
  package-manager:
    description: "Package manager: bun, npm, or pnpm (default: bun)"
    required: false
    default: "bun"
  runtime-version:
    description: "Runtime version for bun/pnpm/node (empty = read from version file / packageManager or fallback default)"
    required: false
    default: ""
  node-version:
    description: "Node.js version (empty = read from .nvmrc / .node-version or fallback default)"
    required: false
    default: ""
  working-directory:
    description: "Working directory relative to repository root"
    required: false
    default: "."
  install-policy:
    description: "Lifecycle script policy: blocked, trusted, or project"
    required: false
    default: "blocked"
  extra-install-dirs:
    description: "Newline or comma-separated list of extra directories needing install"
    required: false
    default: ""

outputs:
  effective-runtime-version:
    description: "The actual resolved runtime version"
    value: ${{ steps.resolve-runtime.outputs.effective-runtime-version }}
  effective-node-version:
    description: "The actual resolved Node.js version"
    value: ${{ steps.resolve-runtime.outputs.effective-node-version }}

runs:
  using: "composite"
  steps:
    - name: Resolve runtime versions
      id: resolve-runtime
      shell: bash
      env:
        IN_WORKDIR: ${{ inputs.working-directory }}
        IN_PKG_MGR: ${{ inputs.package-manager }}
        IN_RUNTIME_VERSION: ${{ inputs.runtime-version }}
        IN_NODE_VERSION: ${{ inputs.node-version }}
      run: |
        python3 -c '
        import os, sys, json, re

        workdir = os.environ.get("IN_WORKDIR", ".")
        pkg_mgr = os.environ.get("IN_PKG_MGR", "bun").strip().lower()
        req_runtime = os.environ.get("IN_RUNTIME_VERSION", "").strip()
        req_node = os.environ.get("IN_NODE_VERSION", "").strip()

        def clean_version(v):
            if not v:
                return ""
            v = v.strip().lstrip("v")
            return v

        def read_file(p):
            try:
                if os.path.isfile(p):
                    with open(p, "r", encoding="utf-8") as f:
                        return f.read().strip()
            except Exception:
                pass
            return ""

        # 1. Resolve packageManager field from package.json if present
        pm_name = ""
        pm_version = ""
        for candidate_pkg in [os.path.join(workdir, "package.json"), "package.json"]:
            raw_pkg = read_file(candidate_pkg)
            if raw_pkg:
                try:
                    data = json.loads(raw_pkg)
                    pm_field = data.get("packageManager", "")
                    if pm_field and "@" in pm_field:
                        pm_name, pm_version = pm_field.split("@", 1)
                        pm_name = pm_name.strip()
                        pm_version = clean_version(pm_version)
                        break
                except Exception:
                    pass

        # 2. Resolve Node version
        eff_node = clean_version(req_node)
        if not eff_node:
            for p in [os.path.join(workdir, ".nvmrc"), ".nvmrc", os.path.join(workdir, ".node-version"), ".node-version"]:
                content = read_file(p)
                if content:
                    eff_node = clean_version(content.splitlines()[0])
                    break
        if not eff_node:
            eff_node = "26.8.1"

        # Check for banned latest/ranges when version is promised
        if eff_node.lower() == "latest" or any(c in eff_node for c in [">", "<", "^", "~", "*"]):
            sys.stderr.write(f"::error::Node version must be exact, got: {eff_node}\n")
            sys.exit(1)

        # 3. Resolve Package Manager runtime version
        eff_runtime = clean_version(req_runtime)
        if not eff_runtime:
            if pkg_mgr == "bun":
                if pm_name == "bun" and pm_version:
                    eff_runtime = pm_version
                else:
                    for p in [os.path.join(workdir, ".bun-version"), ".bun-version"]:
                        content = read_file(p)
                        if content:
                            eff_runtime = clean_version(content.splitlines()[0])
                            break
                    if not eff_runtime:
                        eff_runtime = "1.4.0"
            elif pkg_mgr == "pnpm":
                if pm_name == "pnpm" and pm_version:
                    eff_runtime = pm_version
                else:
                    eff_runtime = "10.5.2"
            elif pkg_mgr == "npm":
                if pm_name == "npm" and pm_version:
                    eff_runtime = pm_version
                else:
                    eff_runtime = eff_node

        if eff_runtime.lower() == "latest" or any(c in eff_runtime for c in [">", "<", "^", "~", "*"]):
            sys.stderr.write(f"::error::{pkg_mgr} version must be exact, got: {eff_runtime}\n")
            sys.exit(1)

        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"effective-runtime-version={eff_runtime}\n")
            f.write(f"effective-node-version={eff_node}\n")

        print(f"Resolved versions: package-manager={pkg_mgr}, runtime={eff_runtime}, node={eff_node}")
        '

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.resolve-runtime.outputs.effective-node-version }}

    - name: Setup Bun
      if: inputs.package-manager == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.resolve-runtime.outputs.effective-runtime-version }}

    - name: Setup pnpm
      if: inputs.package-manager == 'pnpm'
      shell: bash
      env:
        PNPM_VERSION: ${{ steps.resolve-runtime.outputs.effective-runtime-version }}
      run: |
        set -euo pipefail
        if command -v corepack >/dev/null 2>&1; then
          corepack enable
          corepack prepare "pnpm@$PNPM_VERSION" --activate
        else
          npm install -g "pnpm@$PNPM_VERSION"
        fi

    - name: Install dependencies across root and extra directories
      shell: bash
      env:
        IN_POLICY: ${{ inputs.install-policy }}
        IN_PKG_MGR: ${{ inputs.package-manager }}
        IN_WORKDIR: ${{ inputs.working-directory }}
        IN_EXTRA_DIRS: ${{ inputs.extra-install-dirs }}
      run: |
        python3 -c '
        import os, sys, json, subprocess

        policy = os.environ.get("IN_POLICY", "blocked").strip()
        pkg_mgr = os.environ.get("IN_PKG_MGR", "bun").strip()
        workdir = os.environ.get("IN_WORKDIR", ".").strip()
        extra_input = os.environ.get("IN_EXTRA_DIRS", "").strip()

        if policy not in ("blocked", "trusted", "project"):
            sys.stderr.write(f"::error::Invalid install-policy \"{policy}\". Must be blocked, trusted, or project.\n")
            sys.exit(1)

        def norm_dir(raw):
            trimmed = raw.strip()
            if not trimmed:
                return ""
            # Guard against path traversal escape
            parts = trimmed.replace("\\", "/").split("/")
            if ".." in parts or trimmed.startswith("/"):
                sys.stderr.write(f"::error::Directory path traversal forbidden: \"{trimmed}\"\n")
                sys.exit(1)
            norm = os.path.normpath(trimmed)
            if norm in ("", "."):
                return "."
            return norm

        dirs = []
        d0 = norm_dir(workdir)
        if d0:
            dirs.append(d0)

        if extra_input:
            # support comma or newline separation
            raw_lines = extra_input.replace(",", "\n").splitlines()
            for line in raw_lines:
                nd = norm_dir(line)
                if nd:
                    dirs.append(nd)

        # Portable deduplication preserving order (supported on Python 3.7+)
        unique_dirs = list(dict.fromkeys(dirs))

        # Check directories exist
        for d in unique_dirs:
            if not os.path.isdir(d):
                sys.stderr.write(f"::error::Install directory \"{d}\" does not exist.\n")
                sys.exit(1)

        # Validate package.json#trustedDependencies in trusted mode
        if policy == "trusted":
            for d in unique_dirs:
                pkg_path = os.path.join(d, "package.json")
                if os.path.isfile(pkg_path):
                    with open(pkg_path, "r", encoding="utf-8") as f:
                        data = json.load(f)
                    trusted = data.get("trustedDependencies")
                    if trusted is not None:
                        if not isinstance(trusted, list):
                            sys.stderr.write(f"::error::package.json#trustedDependencies in {pkg_path} must be a list\n")
                            sys.exit(1)
                        for item in trusted:
                            if not isinstance(item, str) or not item.strip():
                                sys.stderr.write(f"::error::Invalid item in trustedDependencies in {pkg_path}\n")
                                sys.exit(1)

        # Execute frozen installs per directory
        for d in unique_dirs:
            print(f"::group::Install dependencies in \"{d}\" (manager={pkg_mgr}, policy={policy})")
            if pkg_mgr == "bun":
                has_lock = os.path.isfile(os.path.join(d, "bun.lock")) or os.path.isfile(os.path.join(d, "bun.lockb"))
                if not has_lock:
                    sys.stderr.write(f"::error::Missing bun lockfile in \"{d}\" for frozen install.\n")
                    sys.exit(1)
                cmd = ["bun", "install", "--frozen-lockfile"]
                if policy == "blocked":
                    cmd.append("--ignore-scripts")
            elif pkg_mgr == "npm":
                has_lock = os.path.isfile(os.path.join(d, "package-lock.json")) or os.path.isfile(os.path.join(d, "npm-shrinkwrap.json"))
                if not has_lock:
                    sys.stderr.write(f"::error::Missing package-lock.json in \"{d}\" for frozen install (npm ci).\n")
                    sys.exit(1)
                cmd = ["npm", "ci"]
                if policy == "blocked":
                    cmd.append("--ignore-scripts")
            elif pkg_mgr == "pnpm":
                has_lock = os.path.isfile(os.path.join(d, "pnpm-lock.yaml"))
                if not has_lock:
                    sys.stderr.write(f"::error::Missing pnpm-lock.yaml in \"{d}\" for frozen install.\n")
                    sys.exit(1)
                cmd = ["pnpm", "install", "--frozen-lockfile"]
                if policy == "blocked":
                    cmd.append("--ignore-scripts")
            else:
                sys.stderr.write(f"::error::Unsupported package manager: {pkg_mgr}\n")
                sys.exit(1)

            print(f"Running: {\" \".join(cmd)} in {d}")
            res = subprocess.run(cmd, cwd=d)
            if res.returncode != 0:
                sys.exit(res.returncode)
            print("::endgroup::")
        '
