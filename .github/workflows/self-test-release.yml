name: Self Test Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate D1-D5 deploy workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"

      - name: Helper behavioral tests
        run: |
          node --test .github/actions/docker-manifest/index.test.mjs
          node --test .github/actions/release-source/resolve.test.mjs
          python3 -m unittest discover -s .github/actions/resolve-locked-wrangler -p 'test_*.py'

      - name: Workflow contract tests
        run: |
          node --test .github/actions/release-source/workflow-contract.test.mjs
          node --test .github/slots/internal-pin.test.mjs

      - name: Validate YAML and public D1-D5 interfaces
        run: |
          python3 - <<'PY'
          import pathlib, yaml

          def load(path):
              with open(path) as fh:
                  return yaml.safe_load(fh)

          pin = pathlib.Path('.github/internal-provider-pin.txt').read_text().strip()
          expr = lambda key: '$' + '{{ ' + key + ' }}'

          # deploy-worker.yml
          wf = load('.github/workflows/deploy-worker.yml')
          on = wf.get(True) or wf.get('on')
          assert 'workflow_call' in on
          secrets = on['workflow_call']['secrets']
          assert secrets['CLOUDFLARE_API_TOKEN']['required'] is False
          assert secrets['DEPLOY_SECRET']['required'] is False
          assert 'CLOUDFLARE_ACCOUNT_ID' not in secrets
          inputs = on['workflow_call']['inputs']
          assert inputs['deploy-cli']['default'] == 'wrangler'
          assert inputs['wrangler-version']['default'] == 'lockfile'
          assert inputs['cf-version']['default'] == ''
          assert inputs['verify-command']['required'] is True
          assert inputs['install-policy']['default'] == 'blocked'
          for key in ('artifact-name', 'artifact-path', 'artifact-unpack-command', 'sparse-checkout', 'deploy-script', 'deploy-env', 'deploy-secret-name'):
              assert key in inputs, key
          for legacy in ('source-run-id', 'expected-workflow-path', 'expected-workflow-name', 'require-fresh-main'):
              assert legacy not in inputs, legacy
          job = wf['jobs']['deploy']
          assert job['concurrency']['cancel-in-progress'] is False
          assert 'inputs.environment' in job['environment']['name']
          uses = [step.get('uses', '') for step in job['steps'] if isinstance(step, dict)]
          assert any(item.startswith(f'nocoo/base-ci/.github/actions/setup-js@{pin}') for item in uses)
          assert not any('release-source' in item for item in uses)
          text = pathlib.Path('.github/workflows/deploy-worker.yml').read_text()
          assert 'download-artifact@' in text
          assert 'wrangler-action' not in text
          assert 'bash -lc' not in text
          assert f'CLOUDFLARE_ACCOUNT_ID: {expr("vars.CLOUDFLARE_ACCOUNT_ID")}' in text
          assert 'secrets.CLOUDFLARE_ACCOUNT_ID' not in text

          # deploy-docker.yml
          dwf = load('.github/workflows/deploy-docker.yml')
          don = dwf.get(True) or dwf.get('on')
          dinputs = don['workflow_call']['inputs']
          assert dinputs['deploy-over-ssh']['default'] is True
          assert dinputs['verify-command']['required'] is True
          for job_id in ('d1-preflight', 'd2-artifact', 'd4-deploy'):
              assert job_id in dwf['jobs'], job_id
          docker_text = pathlib.Path('.github/workflows/deploy-docker.yml').read_text()
          assert 'cacheScope' in docker_text
          for var_name in ('DEPLOY_PHASE', 'DEPLOY_URL', 'DEPLOY_ORIGIN_MARKER'):
              assert f'{var_name}: {expr("vars." + var_name)}' in docker_text

          # deploy-pages.yml
          pwf = load('.github/workflows/deploy-pages.yml')
          pon = pwf.get(True) or pwf.get('on')
          pinputs = pon['workflow_call']['inputs']
          assert pinputs['environment']['default'] == 'github-pages'
          assert 'artifact-name' in pinputs and 'source-path' in pinputs
          for job_id in ('d2-artifact', 'd4-deploy'):
              assert job_id in pwf['jobs'], job_id
          pjob = pwf['jobs']['d4-deploy']
          assert pjob['concurrency']['cancel-in-progress'] is False
          assert pjob['needs'] == ['d2-artifact']
          puses = [step.get('uses', '') for step in pjob['steps'] if isinstance(step, dict)]
          assert any(item.startswith('actions/deploy-pages@') for item in puses)

          print('deploy-worker, deploy-docker, and deploy-pages D1-D5 contracts are valid')
          PY
